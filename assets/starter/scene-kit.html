<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<title>{{TITLE}}</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: {{CANVAS}}; }
  #stage { position: absolute; inset: 0; }
</style>
</head>
<body>
<div id="stage"></div>
<!--
  Motion Video Kit — 场景骨架（只有管线，没有设计）。

  这一层负责所有与"能不能渲出来"有关的事：
    · 设计坐标 → 视口的映射（1920×1080 设计空间，任意画幅居中缩放）
    · 图层顺序（纸面 / 世界 / 画布）
    · 缓动库与 DOM 助手
    · 环境持续运动（呼吸 + 漂移）—— 全片不断，用来托住静止段、喂饱运动闸门
    · 画布的 design-space transform

  设计部分由你自己写：宏观结构、签名机制、配色、字号、每一拍的动作。
  不要复用别的片子的构成，那才是"AI 味"的来源；可复用的只是下面这些管道。

  契约：window.seek(t) 必须是纯函数（无 CSS transition / rAF / Date.now）。
-->
<script>
(function () {
  "use strict";

  /* ================================================================ 环境 */
  const W = window.innerWidth, H = window.innerHeight;
  const DW = 1920, DH = 1080;                   // 设计空间
  const S = Math.min(W / DW, H / DH);

  const MNT = Scene.mount({ background: "{{CANVAS}}" });
  const paper = MNT.layer("paper");              // 全幅底色（呼吸用）
  const world = MNT.layer("world");              // 设计坐标层
  world.style.transformOrigin = "0 0";
  world.style.transform = `translate(${(W - DW * S) / 2}px, ${(H - DH * S) / 2}px) scale(${S})`;

  const paperGroup = document.createElement("div");   // 可以整体漂移的"纸"
  Object.assign(paperGroup.style, { position: "absolute", inset: "0", transformOrigin: "0 0" });
  world.appendChild(paperGroup);

  const field = MNT.layer("field");              // 画布层，盖在世界之上
  const cvs = document.createElement("canvas");
  cvs.width = W; cvs.height = H;
  Object.assign(cvs.style, { position: "absolute", inset: "0" });
  field.appendChild(cvs);
  const ctx = cvs.getContext("2d");

  const D = window.SCENE || {};
  const TOTAL = Number(D.duration) || 20;

  /* ================================================================ 曲线 */
  const clamp = (x, a, b) => (x < a ? a : x > b ? b : x);
  const P = (t, a, b) => clamp((t - a) / (b - a), 0, 1);          // 窗口进度
  const EXP = (x) => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x));     // ease-out-expo：揭示默认
  const EO = (x) => 1 - Math.pow(1 - x, 3);
  const IOQ = (x) => (x < 0.5 ? 8 * x * x * x * x : 1 - Math.pow(-2 * x + 2, 4) / 2);
  const IOK = (x) => (x < 0.5 ? 16 * x * x * x * x * x : 1 - Math.pow(-2 * x + 2, 5) / 2);
  const INQ = (x) => x * x * x * x;                                // ease-in-quart：只用于离场
  const mix = (a, b, p) => Anim.mixColor(a, b, clamp(p, 0, 1));
  const L = (a, b, p) => a + (b - a) * p;
  const arc = (p, amp) => Math.sin(Math.PI * clamp(p, 0, 1)) * amp;  // 走弧线而不是直线

  /* ================================================================ DOM 助手
     注意：abs/el 必须把 text 传下去。一个吞掉文本参数的助手，会让整帧内容静默消失。 */
  function el(parent, css, text) {
    const n = document.createElement("div");
    Object.assign(n.style, css);
    if (text !== undefined) n.textContent = text;
    parent.appendChild(n);
    return n;
  }
  const abs = (parent, o, text) => el(parent, Object.assign({ position: "absolute" }, o), text);
  const hair = (parent, x, y, w, h, color) => abs(parent, {
    left: x + "px", top: y + "px", width: w + "px", height: h + "px",
    background: color, transformOrigin: "0 0", opacity: "1"
  });

  /* ================================================================ 环境运动
     全片不断。周期取非整数秒（6.1 / 7.3），否则逐秒比较会看起来像静止。 */
  const breath = (t) => 0.5 - 0.5 * Math.cos((2 * Math.PI * t) / 6.1);
  const drift = (t) => [
    Math.sin(t * 0.147) * 7 + Math.sin(t * 0.061 + 1.1) * 3,
    Math.cos(t * 0.113 + 0.6) * 5 + Math.sin(t * 0.083) * 2
  ];

  /* ================================================================ 占位符（不是设计）
     出片前必须替换成这一支片子自己的构成。它在这里只做两件事：
     证明管线通了、并且让一个空工程也能过运动闸门。 */
  const PHASE = 4.2;
  const probe = hair(paperGroup, 0, 0, Math.round(DW * 0.42), 6, "#14161A");

  /* ================================================================ 每帧 */
  window.seek = function (t) {
    const [dx, dy] = drift(t);

    paper.style.background = mix("{{CANVAS}}", "{{CANVAS2}}", breath(t) * 0.9);
    paperGroup.style.transform = `translate(${dx.toFixed(2)}px, ${dy.toFixed(2)}px)`;

    /* —— 你的构成写在这下面 -------------------------------------------- */

    // 占位：一条带面积的横带扫过（面积 = 运动闸门看得见的东西）
    const q = (t % PHASE) / PHASE;
    probe.style.transform =
      `translate(${(-DW * 0.45 + q * DW * 1.45).toFixed(1)}px, ${(DH * 0.62).toFixed(1)}px)`;
    probe.style.opacity = "0.85";

    /* —— 你的构成写在这上面 -------------------------------------------- */

    /* 画布层：坐标系已经映射到设计空间，直接按设计坐标画 */
    ctx.setTransform(S, 0, 0, S, (W - DW * S) / 2 + dx * S, (H - DH * S) / 2 + dy * S);
    ctx.clearRect(-40, -40, DW + 80, DH + 80);
    ctx.globalAlpha = 1;
  };

  Scene.ready();
})();
</script>
</body>
</html>
