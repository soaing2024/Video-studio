<!doctype html>
<!-- The 30 s "video-studio" flash, rewritten in the director language.
     Same beat sheet, same text whitelist, one take, camera never stops.
     Hand-written original: 1,411 lines / 72.6 KB.  This: see A/B at the bottom. -->
<meta charset="utf-8">
<style>html,body{margin:0;height:100%;overflow:hidden}*{box-sizing:border-box}</style>
<div id="stage"></div>
<script>
const S = D.scene({ duration: 30, bg: "#f5f6f9" });
const INK = "#0b0f14", GREY = "#7c8698";

S.cam([
  [ 0.0, 960, 540,   80, 0.92], [ 2.44, 962, 546,   40, 0.94, 0, "s3"],
  [ 2.76, 900, 498, -120, 0.80, -2.2, "s6"], [ 3.34, 940, 530,  260, 0.86, -1.0],
  [ 4.10, 960, 545,  640, 0.98], [ 5.12, 966, 562,  660, 1.00, 0, "s3"],
  [ 6.02, 984, 572, 1300, 1.30, -1.2, "s3"], [ 6.55, 960, 545, 1520, 0.95],
  [ 7.10, 952, 540, 1700, 0.88], [ 8.20, 1006, 560, 1560, 0.92, 1.4],
  [ 9.80, 1300, 812, 1840, 1.40, -0.6, "s3"], [10.35, 2180, 720, 1900, 0.80, -6.5, "in"],
  [10.95, 2620, 624, 2280, 1.00, 0.5, "s6"], [13.10, 2620, 660, 2280, 1.04, 0],
  [14.40, 2700, 700, 2260, 0.86, 1.6], [15.40, 2760, 660, 2380, 0.86, 2.2],
  [16.30, 2700, 630, 2500, 0.94, 0.6], [17.62, 2600, 612, 2560, 1.00, 0, "s3"],
  [18.20, 2600, 620, 3300, 1.22, -1.0, "in"], [19.30, 2600, 640, 3560, 1.00],
  [20.50, 2320, 700, 3700, 0.94, -3.0, "in"], [21.60, 2820, 620, 3900, 0.92, 2.6, "in"],
  [23.00, 2620, 600, 3700, 0.94], [24.55, 2600, 624, 3580, 1.05, 0, "s3"],
  [27.30, 2600, 590, 3560, 0.98, 0, "s4"], [30.0, 2612, 560, 3540, 0.92, -0.35, "s1"],
], { hits: [[1.68, .3], [2.42, .55], [2.70, 1.1], [3.42, .62], [5.12, .8], [6.02, 1.55],
            [9.22, .62], [10.35, .75], [10.62, .9], [13.14, .85], [15.58, .7], [16.42, .9],
            [17.44, .8], [18.18, 1.45], [20.42, .62], [21.06, .58], [23.30, .85],
            [24.55, 1.7], [26.90, .55], [28.30, .75]] });

/* 0-3s: white field, caret, typing, then the shell blows open */
const cmd = S.panel("cmd", { box: [760, 128], pos: [960, 548], z: 1594, radius: 18,
                             chrome: false, at: "0.28:0 s6 0.55:1 2.60:1 2.82:0 in" });
S.rows(cmd, 3, { x: 26, y: 62, gap: 22, w: 300 });
const typed = S.typing(cmd, "video-studio", { t0: 0.62, dt: 0.095, size: 46, x: 26, y: 20 });
S.el("caret0", { box: [3, 38], pos: [860, 540], z: 1600, style: { background: INK },
                 at: "0:0 s6 0.05:1 2.7:1 3.22:0 in" });
S.fx.wave(2.70, [960, 540, 1600], { r: 1700 });          // the blast
for (let i = 0; i < 6; i++)                               // six windows out of one point
  S.panel("burst" + i, { box: [310, 196], z: 1604 + i * 34, radius: 13,
    pos: [[2.50 + i * .02, 960], [2.92 + i * .02, 960 + Math.cos(i * 1.1) * 560, "s6"],
          [3.34, 960 + Math.cos(i * 1.1) * 560], [4.06, 960, "in"]],
    at: "2.47:0 s6 2.52:.9 2.62:1 3.90:.96 4.10:0 in", mst: true });

/* 3-6s: the modal, then Run, then the dive through it */
const modal = S.panel("modal", { box: [620, 392], pos: [960, 540], z: 2250,
                                 at: "3.00:0 s6 3.10:1 5.34:1 5.56:0 in" });
S.rows(modal, 3, { x: 28, y: 116, gap: 34, w: 90, h: 9 });
S.chart(modal, { x: 300, y: 214, w: 292, h: 86, bars: 14, gap: 21, bw: 11 });
const title = S.text("viewskill", "View Skill", { size: 30, pos: [1000, 560 - 196],
                                                  z: 2260, weight: "600",
                                                  at: "3.34:0 s6 3.52:1 5.36:0 in" });
const run = S.text("run", "Run", { size: 19, pos: [1176, 696], z: 2300, weight: "600",
                                   color: "#fff", at: "4.05:0 s6 4.25:1 5.30:0 in" });
S.el("runbtn", { box: [132, 44], pos: [1176, 696], z: 2298, radius: 12,
                 style: { background: "#0b0f14", borderRadius: "12px" },
                 at: "4.05:0 s6 4.25:1 5.30:0 in" });
S.fx.wave(5.14, [1178, 690, 2212], { r: 620 });

/* 6-10s: the compile window the button becomes, its code stream, and the two lines */
const portal = S.panel("compile", { box: [1000, 620], pos: [960, 540], z: 2500, radius: 20,
  at: "5.26:0 s6 5.36:1 10.10:1 10.90:0 in", mst: true });
S.rows(portal, 5, { x: 150, y: 80, gap: 34, w: 320, dot: false });
S.chart(portal, { x: 150, y: 300, w: 520, h: 150, bars: 16, gap: 32, bw: 14 });
S.rows(portal, 4, { x: 150, y: 480, gap: 26, w: 420, dot: false });
const prog = S.el("progfill", { box: [700, 7], pos: [490, 846], z: 2520, radius: 4,
  style: { background: "linear-gradient(90deg,#0b0f14,#1f6bff)", borderRadius: "4px" },
  sx: "6.3:.02 s2 9.6:1 s1" });
const gen = S.text("gen", "Generate", { size: 19, pos: [1270, 856], z: 2540, weight: "600",
  color: "#fff", at: "9.06:0 s6 9.3:1 10.1:0 in" });
S.el("genbtn", { box: [152, 44], pos: [1270, 856], z: 2535, radius: 12,
  style: { background: "#0b0f14", borderRadius: "12px" }, at: "9.06:0 s6 9.3:1 10.1:0 in" });
const l1 = S.text("l1", "One compile. One generation.", { size: 76, pos: [960, 175], z: 2420,
  at: "6.40:0 s6 6.62:1 7.72:1 8.18:0 in" });
const l2 = S.text("l2", "一次编译，一次生成", { size: 42, pos: [960, 258], z: 2420, color: GREY,
  at: "7.02:0 s6 7.24:1 8.00:1 8.44:0 in" });
for (let i = 0; i < 6; i++)     // cards that fly through the compile beat
  S.panel("fly" + i, { box: [236, 148], radius: 13, z: 2300 + i * 40, pos: [960, 380 + (i % 4) * 120],
    x: [[6.35 + i * .17, i % 2 ? 2460 : -540], [6.90 + i * .17, i % 2 ? 1780 : 140, "s6"],
        [9.9, 1780], [10.55, i % 2 ? 2860 : -940, "in"]],
    at: "6.25:0 s6 6.35:.9 6.49:1 10.34:1 10.66:0 in", mst: true });

/* 10-14s: the whip pan drags the chat in, the message is typed and sent */
const chat = S.panel("chat", { box: [720, 470], pos: [2600, 624], z: 3900, radius: 20,
  at: "10.18:0 s6 10.28:1 15.10:1 15.80:0 in",
  x: [[0, 3380], [10.35, 3380], [10.95, 2620, "s6"], [15.4, 2700]],
  rot: [[0, 3.4], [10.95, 0.5, "s6"], [15.5, -2.4]] });
S.rows(chat, 6, { x: 30, y: 70, gap: 40, w: 220 });
S.rows(chat, 2, { x: 40, y: 340, gap: 26, w: 300, dot: false });
S.el("input", { box: [640, 76], pos: [360, 356], z: 3920, parent: chat, radius: 14,
  style: { background: "rgba(255,255,255,.92)", border: "1px solid rgba(15,23,42,.09)" } });
S.typing(chat, "video-studio", { t0: 11.02, dt: 0.118, size: 27, x: 62, y: 338 });
S.el("send", { box: [48, 48], pos: [574, 356], z: 3940, parent: chat,
  style: { background: "#0b0f14", borderRadius: "50%" }, at: "12.42:0 s6 12.72:1 13.36:0 in" });
S.fx.wave(13.16, [3122, 742, 3860], { r: 620 });

/* 14-18s: the answer arrives as cards, becomes a thumbnail, then Preview */
for (let i = 0; i < 5; i++)
  S.panel("rc" + i, { box: [266, 168], radius: 13, z: 4120 + i * 50,
    pos: [[14.16 + i * .24, 2340 + (i % 2) * 560], [14.78 + i * .24, 2340 + (i % 2) * 560, "s6"],
          [15.3, 2340 + (i % 2) * 560], [15.88, 2600, "in"]],
    at: "14.04:0 s6 14.16:.92 14.32:1 15.40:1 15.84:0 in", mst: true });
const result = S.panel("result", { box: [560, 360], pos: [2600, 620], z: 4210,
  at: "13.86:0 s6 13.96:.96 14.20:1 17.44:1 17.90:0 in" });
S.rows(result, 2, { x: 20, y: 60, gap: 26, w: 300, dot: false });
S.chart(result, { x: 20, y: 120, w: 500, h: 130, bars: 14, gap: 36, bw: 18 });
S.typing(result, "video-studio", { t0: 14.6, dt: 0.06, size: 22, x: 24, y: 8, keepCaret: false });
const prev = S.text("preview", "Preview", { size: 17, pos: [2804, 934], z: 4260, weight: "600",
  color: "#fff", at: "16.30:0 s6 16.52:1 17.62:0 in" });
S.el("pbtn", { box: [152, 38], pos: [2804, 934], z: 4250, radius: 11,
  style: { background: "#0b0f14", borderRadius: "11px" }, at: "15.20:0 s6 15.4:1 17.62:0 in" });

/* 18-23s: inside the video - full frame, HUD, cards sweeping past the lens */
const vid = S.panel("video", { box: [1240, 720], pos: [2600, 620], z: 4400, radius: 22,
  at: "17.24:0 s6 17.34:1 26.10:1 26.74:0 in",
  sx: "17.34:.42 s3 18.10:1 s1 25:1.06", sy: "17.34:.40 s3 18.10:1 s1 25:1.06" });
S.rows(vid, 3, { x: 40, y: 90, gap: 36, w: 300, dot: false });
S.chart(vid, { x: 40, y: 260, w: 560, h: 160, bars: 16, gap: 34, bw: 15 });
S.fx.hud([2600, 620, 1240, 720], { z: 4400, from: 18.35, until: 23.0, a: 0.5 });
S.text("cap", "One compile. One generation.", { size: 40, pos: [2600, 900], z: 3420,
  at: "20.94:0 s6 21.10:1 22.10:1 22.46:0 in", mst: true });
for (let i = 0; i < 7; i++)
  S.panel("sweep" + i, { box: [300, 196], radius: 13, z: 4700,
    pos: [[19.30 + i * .38, 2280 + i * 120], [19.92 + i * .38, 2600 + i * 40, "s5"],
          [20.60 + i * .38, 3760 + i * 60]],
    at: (19.30 + i * .38) + ":0 s6 " + (19.30 + i * .38) + ":1 " + (20.58 + i * .38) + ":1 "
        + (20.88 + i * .38) + ":0 in", mst: true });

/* 23-27s: Use this Skill becomes Star it., particles, the count climbs */
const bar = S.panel("bar", { box: [620, 96], pos: [2600, 948], z: 5100, radius: 26,
  at: "23.04:0 s6 23.14:.98 23.34:1 26.44:1 26.98:0 in" });
S.rows(bar, 1, { x: 100, y: 40, gap: 0, w: 180, dot: false });
const use = S.text("use", "Use this Skill", { size: 25, pos: [2760, 948], z: 5120, weight: "600",
  at: "23.10:0 s6 23.34:1 24.58:1 24.84:0 in" });
const star = S.text("starlbl", "Star it.", { size: 25, pos: [2760, 948], z: 5120, weight: "600",
  at: "24.62:0 s6 24.88:1 26.60:1 26.98:0 in" });
const count = S.text("count", "12,431", { size: 23, pos: [2904, 948], z: 5120, weight: "600",
  color: GREY, mono: true, at: "24.66:0 s6 24.96:1 26.60:1 26.98:0 in" });
S.el("starico", { box: [56, 56], pos: [2650, 948], z: 5130, radius: 17,
  style: { background: "#1f6bff", borderRadius: "17px" }, at: "24.60:0 s6 24.94:1 26.60:1 26.98:0 in" });
S.fx.burst(24.55, [2646, 948, 5100], { n: 190 });

/* 27-30s: everything folds into one line */
const end = S.text("end", "Star it.", { size: 176, pos: [2600, 540], z: 5200, weight: "600",
  keep: true, at: "27.10:0 s6 27.40:1 30:1" });
const cn = S.text("cn", "去点亮 Star", { size: 36, pos: [2600, 664], z: 5200, color: GREY,
  keep: true, at: "27.90:0 s6 28.60:1 30:1" });
S.collect({ t: 26.86, dur: 1.55, to: [2600, 556, 5200] });
</script>
