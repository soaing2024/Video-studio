<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #04060c; }
  #stage { position: absolute; inset: 0; }
  #particles { position: absolute; inset: 0; }
  .layer { position: absolute; inset: 0; will-change: transform; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="../runtime/anim.js"></script>
<script src="../runtime/kit.js"></script>
<script>
// stat: the number is the animation. It counts, overshoots, settles, re-counts on every beat, and
// the ring around it never stops travelling - so the shot is in motion for its whole duration.
const S = window.SCENE || {};
const V = S.visual || {};
const M = S.motion || {};
const CH = S.choreography || { beats: [{ t: 0, kind: "establish", intensity: 1 }] };
const D = S.duration || 6;
const C = Object.assign({
  bg: "#0a0e1d", surface: "#141a2c", border: "#2a3550", text: "#f8fafc", dim: "#93a3bd",
  accent: "#e0455f", accent2: "#38bdf8", accent3: "#a78bfa", series: ["#e0455f"]
}, V.colors || {});
const SHAKE = M.shake || { amp: 1.6, decay: 0.3, freq: 13 };
const DEPTH = M.depth || { bg: 0.3, mid: 0.75, fg: 1.15 };
const PARTICLES = M.particles || { count: 24, speed: 22, size: 2, opacity: 0.3, vertical: 8, mode: "dust" };
const TS = V.type_scale || 1;
const RADIUS = V.radius === undefined ? 10 : V.radius;
const TEX = V.texture || "none";
const TEX_AMOUNT = V.texture_amount || 0.1;
const VIGNETTE = V.vignette || 0.25;

const stage = document.getElementById("stage");
const H = () => window.innerHeight, W = () => window.innerWidth;
const TARGET = Number(S.value ?? S.number ?? 100);
const FROM = Number(S.from ?? 0);
const ALT = S.valueAlt === undefined ? null : Number(S.valueAlt);
const DEC = Number(S.decimals ?? (Number.isInteger(TARGET) ? 0 : 1));
const PREFIX = S.prefix || "", SUFFIX = S.suffix || "";

let L = null, cam = null, particles = [], scene = null;

function build() {
  const s = H() / 720;
  stage.innerHTML = "";
  stage.style.background =
    `radial-gradient(${80 * s}% ${80 * s}% at 50% 40%, ${Kit.rgba(C.accent, 0.16)} 0%, ${Kit.rgba(C.accent, 0)} 60%),` +
    `linear-gradient(160deg, #101832 0%, ${C.bg} 55%, #04060c 100%)`;
  const kit = Kit.buildStage(stage, {});
  particles = Kit.seedParticles(PARTICLES, S.id || "stat", W(), H());
  scene = new Anim.Scene();

  const tex = Kit.el(kit.layerBg, "div", Object.assign({ position: "absolute", inset: "0", opacity: "0" },
                                                       Kit.textureCss(TEX, C.border, TEX_AMOUNT)));
  const halo = Kit.el(kit.layerBg, "div", { position: "absolute", left: "50%", top: `${40 * s}%`,
    width: `${760 * s}px`, height: `${760 * s}px`, marginLeft: `${-380 * s}px`, marginTop: `${-380 * s}px`,
    opacity: "0", pointerEvents: "none",
    background: `radial-gradient(closest-side, ${Kit.rgba(C.accent, 0.3)}, ${Kit.rgba(C.accent, 0)} 70%)` });
  const sweep = Kit.el(kit.layerBg, "div", { position: "absolute", top: `${-40 * s}%`, height: `${180 * s}%`,
    width: `${(M.sweep && M.sweep.width ? M.sweep.width : 200) * s}px`, opacity: "0", pointerEvents: "none",
    background: `linear-gradient(90deg, ${Kit.rgba(C.text, 0)}, ${Kit.rgba(C.text, (M.sweep && M.sweep.opacity) || 0.1)}, ${Kit.rgba(C.text, 0)})`,
    filter: `blur(${20 * s}px)`, transform: `rotate(${(M.sweep && M.sweep.angle) || 0}deg)` });
  const vign = Kit.el(kit.layerBg, "div", { position: "absolute", inset: "0", opacity: "0", pointerEvents: "none",
    background: `radial-gradient(78% 78% at 50% 46%, rgba(0,0,0,0) 42%, rgba(0,0,0,${VIGNETTE}) 100%)` });

  // big soft shapes crossing the frame: without them a text-only shot has nothing to move
  const blobs = Kit.backdrop(kit.layerBg, { color: C.accent, alpha: 0.24, count: 4, blur: 10,
                                       scale: s, width: 1280, height: 720, duration: D,
                                       seed: (S.id || "stat") + "-bg" });

  const centered = (V.layout || "center") !== "offset";
  const baseX = centered ? 0 : -140 * s;
  const ringSize = 430 * s;
  const ring = Kit.el(kit.layerMid, "div", { position: "absolute", left: "50%", top: `${44 * s}%`,
    width: `${ringSize}px`, height: `${ringSize}px`, marginLeft: `${-ringSize / 2 + baseX}px`,
    marginTop: `${-ringSize / 2}px`, borderRadius: "50%", opacity: "0",
    border: `${2 * s}px solid ${Kit.rgba(C.accent, 0.55)}`,
    borderTopColor: C.accent2, borderRightColor: Kit.rgba(C.accent3, 0.7),
    boxShadow: `0 0 ${60 * s}px ${Kit.rgba(C.accent, 0.25)}` });
  const ringA = scene.actor(ring, { opacity: 0, scale: 0.62, rot: 0 });

  // a thick arc sweeping the whole time: high-contrast mass in constant motion
  const arcSvg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  arcSvg.setAttribute("viewBox", "0 0 " + ringSize + " " + ringSize);
  Object.assign(arcSvg.style, { position: "absolute", left: "50%", top: `${44 * s}%`,
    width: `${ringSize}px`, height: `${ringSize}px`, marginLeft: `${-ringSize / 2 + baseX}px`,
    marginTop: `${-ringSize / 2}px`, opacity: "0", pointerEvents: "none" });
  const arcPath = document.createElementNS("http://www.w3.org/2000/svg", "circle");
  arcPath.setAttribute("cx", String(ringSize / 2));
  arcPath.setAttribute("cy", String(ringSize / 2));
  arcPath.setAttribute("r", String(ringSize / 2 - 9 * s));
  arcPath.setAttribute("fill", "none");
  arcPath.setAttribute("stroke", C.accent2);
  arcPath.setAttribute("stroke-width", String(16 * s));
  arcPath.setAttribute("stroke-linecap", "round");
  const arcLen = 2 * Math.PI * (ringSize / 2 - 9 * s);
  arcPath.setAttribute("stroke-dasharray", (arcLen * 0.30) + " " + arcLen);
  arcSvg.appendChild(arcPath);
  kit.layerMid.appendChild(arcSvg);
  const arcA = scene.actor(arcSvg, { opacity: 0, rot: 0 });
  arcA.to({ opacity: 0.9, rot: 320 }, { at: 0, dur: D, ease: "linear" });

  const dot = Kit.el(kit.layerMid, "div", { position: "absolute", left: "50%", top: `${44 * s}%`,
    width: `${10 * s}px`, height: `${10 * s}px`, marginLeft: `${-5 * s + baseX}px`, marginTop: `${-5 * s}px`,
    borderRadius: "50%", background: C.accent, opacity: "0" });
  const dotA = scene.actor(dot, { opacity: 0, scale: 0.4 });

  const mkText = (parent, css, text) => Kit.el(parent, "div", css, text);
  const stack = Kit.el(kit.layerFg, "div", { position: "absolute", left: "50%", top: `${30 * s}%`,
    width: `${1000 * s}px`, marginLeft: `${-500 * s + baseX}px`, textAlign: "center" });
  // normal flow: the browser measures the line boxes, so nothing can overlap however tall the
  // CJK glyphs turn out to be
  const eyebrow = mkText(stack, { opacity: "0", fontSize: `${15 * s}px`, lineHeight: "1.2", letterSpacing: `${4 * s}px`,
    marginBottom: `${10 * s}px`, color: C.dim }, S.eyebrow || "");
  const value = mkText(stack, { opacity: "0", fontSize: `${168 * TS * s}px`, lineHeight: "1",
    fontWeight: "500", color: C.text, fontVariantNumeric: "tabular-nums" }, PREFIX + "0" + SUFFIX);
  const label = mkText(stack, { fontSize: `${30 * s}px`, lineHeight: "1.2", color: C.text, opacity: "0",
    marginTop: `${24 * s}px` }, S.label || S.title || "");
  const sub = mkText(stack, { fontSize: `${18 * s}px`, lineHeight: "1.3", color: C.dim, opacity: "0",
    marginTop: `${8 * s}px` }, S.subtitle || "");
  const footer = Kit.el(kit.layerFg, "div", { position: "absolute", left: "0", right: "0", bottom: `${26 * s}px`,
    textAlign: "center", fontSize: `${13 * s}px`, color: "#5d6b83", opacity: "0" }, S.footer || "");
  const chip = Kit.el(kit.layerFg, "div", { position: "absolute", left: "0", right: "0", top: `${48 * s}px`,
    textAlign: "center", fontSize: `${13 * s}px`, letterSpacing: `${2 * s}px`, color: C.accent, opacity: "0" },
    S.chapter ? String(S.chapter.index).padStart(2, "0") + " / " + String(S.chapter.total).padStart(2, "0") : "");

  const eyebrowA = scene.actor(eyebrow, { opacity: 0, y: -14 });
  const valueA = scene.actor(value, { opacity: 0, y: 40, scale: 1.08 });
  const numA = new Anim.Actor(document.createElement("div"), { v: FROM });
  const labelA = scene.actor(label, { opacity: 0, y: 22 });
  const subA = scene.actor(sub, { opacity: 0, y: 18 });
  const footerA = scene.actor(footer, { opacity: 0 });
  const chipA = scene.actor(chip, { opacity: 0, y: -10 });

  cam = Kit.makeCamera(M, [{ node: kit.layerBg, depth: DEPTH.bg }, { node: kit.layerGhost, depth: DEPTH.bg * 0.8 },
                           { node: kit.layerMid, depth: DEPTH.mid }, { node: kit.layerFg, depth: DEPTH.fg }],
                       { hits: (CH.beats || []).filter(b => b.kind === "emphasis").map(b => b.t),
                         shake: SHAKE, duration: D, boost: 1.9 });

  // ---------------- beat sheet ----------------
  const at = (k) => (CH.beats || []).find(b => b.kind === k);
  const kinds = (k) => (CH.beats || []).filter(b => b.kind === k);
  const est = at("establish") || { t: 0 };

  eyebrowA.to({ opacity: 1, y: 0 }, { at: est.t + 0.05, dur: 0.5, ease: "out" });
  chipA.to({ opacity: 0.9, y: 0 }, { at: est.t + 0.15, dur: 0.5, ease: "out" });
  valueA.to({ opacity: 1, y: 0, scale: 1 }, { at: est.t + 0.2, dur: 0.9, spring: 0.55, damping: 0.62 });
  numA.to({ v: TARGET }, { at: est.t + 0.2, dur: 1.5, spring: 0.7, damping: 0.72 });
  ringA.to({ opacity: 1, scale: 1, rot: 40 }, { at: est.t + 0.35, dur: 1.4, ease: "out", arc: 30 });
  dotA.to({ opacity: 1, scale: 1 }, { at: est.t + 0.5, dur: 0.6, spring: 0.9, damping: 0.45 });

  (at("build") ? [at("build")] : []).forEach(b => {
    labelA.to({ opacity: 1, y: 0 }, { at: b.t, dur: 0.55, ease: "out", anticipation: 0.12 });
    subA.to({ opacity: 1, y: 0 }, { at: b.t + 0.18, dur: 0.55, ease: "out" });
    ringA.to({ rot: 190 }, { at: b.t, dur: 1.6, ease: "inout", arc: 24 });
  });

  kinds("emphasis").forEach((b, i) => {
    const I = b.intensity || 1;
    valueA.to({ scale: 1 + 0.05 * I }, { at: b.t, dur: 0.22, ease: "out" });
    valueA.to({ scale: 1 }, { at: b.t + 0.3, dur: 0.7, spring: 0.8, damping: 0.42 });
    ringA.to({ scale: 1 + 0.09 * I, rot: 190 + 120 * (i + 1) }, { at: b.t, dur: 0.9, spring: 0.7, damping: 0.5 });
    dotA.to({ scale: 1.9 }, { at: b.t, dur: 0.4, spring: 0.9, damping: 0.35 });
    dotA.to({ scale: 1 }, { at: b.t + 0.6, dur: 0.5, ease: "out" });
    labelA.to({ y: -4 }, { at: b.t, dur: 0.3, ease: "out" });
    labelA.to({ y: 0 }, { at: b.t + 0.4, dur: 0.6, spring: 0.6, damping: 0.5 });
  });

  // transform: the number re-counts to a second value (or overshoots and settles back)
  kinds("transform").forEach((b, i) => {
    // never round: a small target (0.42s and the like) would round straight to zero
    const next = (ALT !== null) ? ALT : TARGET * (i % 2 ? 0.82 : 1.18);
    numA.to({ v: next }, { at: b.t, dur: 0.9, spring: 0.75, damping: 0.55 });
    if (i % 2 === 1 && ALT !== null) numA.to({ v: TARGET }, { at: b.t + 1.4, dur: 0.8, ease: "out" });
    subA.to({ x: i % 2 ? 10 : -10, opacity: 1 }, { at: b.t, dur: 0.8, ease: "inout" });
    subA.to({ x: 0 }, { at: b.t + 0.9, dur: 0.6, ease: "out" });
  });

  kinds("count").forEach(b => {
    const next = ALT !== null ? ALT : TARGET * 1.35;
    numA.to({ v: next }, { at: b.t, dur: 1.6, spring: 0.6, damping: 0.8 });
    numA.to({ v: TARGET }, { at: b.t + 2.0, dur: 0.9, ease: "out" });
  });

  kinds("shuffle").forEach((b, n) => {
    labelA.to({ y: (n % 2 ? 44 : -44), opacity: 0.2 }, { at: b.t, dur: 0.5, ease: "in" });
    labelA.to({ y: 0, opacity: 1 }, { at: b.t + 0.5, dur: 0.7, spring: 0.7, damping: 0.5 });
  });

  kinds("reveal").forEach(b => {
    ringA.to({ opacity: 0.35 }, { at: b.t, dur: 0.3, ease: "in" });
    ringA.to({ opacity: 1 }, { at: b.t + 0.3, dur: 0.5, ease: "out" });
  });

  const ex = at("exit");
  if (ex) {
    valueA.to({ y: -10, scale: 0.99 }, { at: ex.t, dur: 0.42, ease: "in" });
    ringA.to({ scale: 0.97 }, { at: ex.t, dur: 0.42, ease: "in" });
  }

  return { s, kit, scene, tex, halo, sweep, vign, cam, numA, valueA, ringA, dotA, particles, blobs, arcA,
           valueNode: value };
}

L = build();
window.addEventListener("resize", () => { L = build(); });
window.__sceneReady = true;

window.seek = (t) => {
  const fadeOut = 1 - Anim.EASE.out(Math.min(1, Math.max(0, (t - (D - 0.45)) / 0.45)));
  const bump = L.cam.apply(t);
  L.scene.seek(t, null);          // render every actor: without this the scene stays at opacity 0
  L.blobs.forEach(b => b.render(t));
  L.kit.layerFg.style.opacity = fadeOut.toFixed(4);
  L.kit.layerMid.style.opacity = fadeOut.toFixed(4);
  L.kit.flash.style.background = `radial-gradient(120% 120% at 50% 50%, ${Kit.rgba(C.accent, 0.45)}, ${Kit.rgba(C.accent, 0)} 60%)`;
  L.kit.flash.style.mixBlendMode = "screen";
  L.kit.flash.style.opacity = (Math.min(0.4, bump * 0.3) * fadeOut).toFixed(4);
  Kit.ambient(L, t, { fade: fadeOut, textureAmount: TEX_AMOUNT,
                      pulseAmount: (M.pulse && M.pulse.amount) || 0.012,
                      pulseFreq: (M.pulse && M.pulse.freq) || 1,
                      sweepSpeed: (M.sweep && M.sweep.speed) || 360,
                      sweepOpacity: (M.sweep && M.sweep.opacity) || 0.1 });
  Kit.drawParticles(L.kit.ctx, L.particles, t, C.text, W(), H());

  // the value keeps a small odometer shudder so even between beats it is not a still image
  const raw = L.numA.sample(t).v || 0;
  const shudder = 1 + 0.006 * Math.sin(t * 7.3);
  const shown = raw * shudder;
  L.valueNode.textContent = PREFIX + shown.toFixed(DEC) + SUFFIX;

};

window.seek(0);
</script>
</body>
</html>
