<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #06080f; }
  #stage { position: absolute; inset: 0; }
</style>
</head>
<body>
<div id="stage"></div>
<script>
// stat: one big number that counts up. For shorts hooks and explainer headline figures.
const S = window.SCENE || {};
const D = S.duration || 6;
const stage = document.getElementById("stage");
const accent = S.accent || "#e0455f";
const COL = Object.assign({ bg: "#0a0e1d", text: "#f8fafc", dim: "#93a3bd" }, S.colors || {});
const k = () => window.innerHeight / 720;
const clamp01 = (x) => Math.min(1, Math.max(0, x));
const easeOutCubic = (x) => 1 - Math.pow(1 - x, 3);
const easeOutQuint = (x) => 1 - Math.pow(1 - x, 5);

function hexA(hex, a) {
  const h = hex.replace("#", "");
  const n = parseInt(h.length === 3 ? h.split("").map(c => c + c).join("") : h, 16);
  return `rgba(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}, ${a})`;
}

let L = null;
function build() {
  const s = k();
  stage.innerHTML = "";
  stage.style.background =
    `radial-gradient(${80 * s}% ${80 * s}% at 50% 40%, ${hexA(accent, 0.18)} 0%, ${hexA(accent, 0)} 60%),` +
    `linear-gradient(160deg, #101832 0%, ${COL.bg} 55%, #06080f 100%)`;
  const mk = (css, text) => {
    const n = document.createElement("div");
    Object.assign(n.style, css);
    if (text !== undefined) n.textContent = text;
    stage.appendChild(n);
    return n;
  };
  const eyebrow = mk({ position: "absolute", left: "0", right: "0", top: `${168 * s}px`, textAlign: "center",
    fontSize: `${15 * s}px`, letterSpacing: `${4 * s}px`, color: COL.dim, opacity: "0" }, S.eyebrow || "");
  const value = mk({ position: "absolute", left: "0", right: "0", top: `${208 * s}px`, textAlign: "center",
    fontSize: `${168 * s}px`, lineHeight: "1", fontWeight: "500", color: COL.text,
    fontVariantNumeric: "tabular-nums", opacity: "0" }, "0");
  const rule = mk({ position: "absolute", left: "50%", top: `${412 * s}px`, width: "0", height: `${3 * s}px`,
    background: accent, transform: "translateX(-50%)", borderRadius: `${3 * s}px`,
    boxShadow: `0 0 ${22 * s}px ${hexA(accent, 0.6)}` });
  const label = mk({ position: "absolute", left: "0", right: "0", top: `${436 * s}px`, textAlign: "center",
    fontSize: `${30 * s}px`, color: COL.text, opacity: "0" }, S.label || S.title || "");
  const sub = mk({ position: "absolute", left: "0", right: "0", top: `${486 * s}px`, textAlign: "center",
    fontSize: `${18 * s}px`, color: COL.dim, opacity: "0" }, S.subtitle || "");
  const footer = mk({ position: "absolute", left: "0", right: "0", top: `${654 * s}px`, textAlign: "center",
    fontSize: `${13 * s}px`, letterSpacing: `${1 * s}px`, color: "#5d6b83", opacity: "0" }, S.footer || "");
  return { eyebrow, value, rule, label, sub, footer, s };
}

L = build();
window.addEventListener("resize", () => { L = build(); });
window.__sceneReady = true;

window.seek = (t) => {
  const fadeOut = 1 - easeOutCubic(clamp01((t - (D - 0.5)) / 0.5));
  const p = clamp01((t - 0.35) / 1.25);
  const from = Number(S.from ?? 0);
  const to = Number(S.value ?? S.number ?? 100);
  const current = from + (to - from) * easeOutQuint(p);
  const decimals = Number(S.decimals ?? (Number.isInteger(to) ? 0 : 1));
  L.value.textContent = (S.prefix || "") + current.toFixed(decimals) + (S.suffix || "");
  L.eyebrow.style.opacity = (easeOutCubic(clamp01((t - 0.1) / 0.4)) * fadeOut).toFixed(4);
  L.value.style.opacity = (clamp01(p * 3) * fadeOut).toFixed(4);
  L.value.style.transform = `translateY(${((1 - easeOutCubic(clamp01(p * 1.4))) * 18 * L.s).toFixed(2)}px)`;
  L.rule.style.width = `${(220 * L.s * easeOutCubic(clamp01((t - 0.9) / 0.7))).toFixed(2)}px`;
  L.label.style.opacity = (easeOutCubic(clamp01((t - 1.15) / 0.5)) * fadeOut).toFixed(4);
  L.sub.style.opacity = (easeOutCubic(clamp01((t - 1.4) / 0.5)) * fadeOut).toFixed(4);
  L.footer.style.opacity = (0.9 * easeOutCubic(clamp01((t - 1.6) / 0.5)) * fadeOut).toFixed(4);
};

window.seek(0);
</script>
</body>
</html>
