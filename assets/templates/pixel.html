<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #0f1220; }
  canvas { display: block; image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="screen" width="320" height="180"></canvas>
<script src="../runtime/anim.js"></script>
<script src="../runtime/kit.js"></script>
<script>
// pixel: the same beat-sheet idea, but every value is quantised to the 320x180 grid so the art stays
// pixel-perfect. Motion is whole-pixel travel, stepped hops and palette flashes - no sub-pixel drift.
const S = window.SCENE || {};
const V = S.visual || {};
const M = S.motion || {};
const CH = S.choreography || { beats: [{ t: 0, kind: "establish", intensity: 1 }] };
const A = S.assets || {};
const D = S.duration || 8;
const BASE_W = 320, BASE_H = 180;
const C = Object.assign({
  bg: "#0f1220", bg2: "#171b2c", border: "#2b3350", text: "#e8eef7", dim: "#8b9bb4", dim2: "#5d6b83",
  accent: "#e0455f", accent2: "#38bdf8", accent3: "#a78bfa", amber: "#fbbf24", green: "#4ade80",
  black: "#05070d", series: ["#e0455f", "#38bdf8", "#a78bfa", "#4ade80"]
}, V.colors || {});



const cv = document.getElementById("screen");
const ctx = cv.getContext("2d");
const buf = document.createElement("canvas");
let sprite = null, shadow = null, ready = false, loaded = 0, k = 1, P = [];
const H = () => window.innerHeight, W = () => window.innerWidth;

function layout() {
  const w = W(), h = H();
  k = Math.max(1, Math.floor(Math.min(w / BASE_W, h / BASE_H)));
  cv.width = BASE_W * k; cv.height = BASE_H * k;
  cv.style.marginLeft = Math.round((w - cv.width) / 2) + "px";
  cv.style.marginTop = Math.round((h - cv.height) / 2) + "px";
  ctx.setTransform(k, 0, 0, k, 0, 0);
  ctx.imageSmoothingEnabled = false;
}
function px(x, y, w, h, color) { ctx.fillStyle = color; ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); }
function text(str, x, y, size, color, weight) {
  ctx.font = (weight || "") + " " + size + "px 'Microsoft YaHei UI', 'Microsoft YaHei', monospace";
  ctx.textBaseline = "top"; ctx.fillStyle = color; ctx.fillText(str, Math.round(x), Math.round(y));
}
function dither(x0, y0, x1, y1, color) {
  ctx.fillStyle = color;
  for (let y = y0; y < y1; y += 2)
    for (let x = x0 + ((y >> 1) & 1); x < x1; x += 2) ctx.fillRect(x, y, 1, 1);
}
function seedPix() {
  const rnd = Kit.rng(S.id || "pixel");
  P = Array.from({ length: 22 }, () => ({
    x: Math.round(rnd() * BASE_W), y: Math.round(rnd() * BASE_H),
    s: rnd() < 0.5 ? 1 : 2, v: 4 + rnd() * 14, ph: rnd() * 6.28
  }));
}

// quantised numeric tracks: the runtime does the timing maths, we round at draw time
function track(initial, moves) {
  // Drift on every quantised track: even a held pose keeps sub-pixel life before it is rounded.
  const a = new Anim.Actor(document.createElement("div"), initial,
                           { drift: M.drift, phase: (MOVES.length * 0.29) % 1 });
  moves.forEach(m => a.to(m.to, m));
  return a;
}
function q(t, actor, key, fallback) {
  const v = actor.sample(t)[key];
  return Math.round(v === undefined ? fallback : v);
}

const BEATS = CH.beats || [];
const kinds = (kind) => BEATS.filter(b => b.kind === kind);
const at = (kind) => BEATS.find(b => b.kind === kind) || null;
const MOVES = [];
const HITS = kinds("emphasis").map(b => b.t);
// The camera is a spline through the shot's beat sheet rather than a list of separate eases: it
// never restarts from a standstill, and a restage is a hard jump in the same track. Values are
// rounded at draw time, which is the whole point of the template.
const CAM = (M.camera_keys && M.camera_keys.length)
  ? new Anim.Path(M.camera_keys)
  : track({ x: 0, y: 0 }, [{ at: 0, dur: D, to: { x: 0, y: 0 }, ease: "inout" }]);

let spriteY = track({ v: 46 }, []);
let scanY = track({ v: -14 }, []);
function choreograph() {
  const est = at("establish") || { t: 0 };
  spriteY = track({ v: 46 }, kinds("build").concat(kinds("transform")).concat(kinds("count")).map((b, i) => ({
    at: b.t, dur: 0.32, to: { v: i % 2 ? 42 : 46 }, ease: "out", spring: 1.1, damping: 0.35
  })));
  scanY = track({ v: -14 }, kinds("emphasis").concat(kinds("reveal")).map(b => ({
    at: b.t, dur: 1.2, to: { v: 170 }, ease: "inout"
  })));
  void est;
}

layout();
window.addEventListener("resize", layout);
if (A.sprite) {
  sprite = new Image();
  const total = A.spriteShadow ? 2 : 1;
  const done = () => { if (++loaded >= total) { ready = true; window.__sceneReady = true; window.seek(0); } };
  sprite.onload = done; sprite.onerror = done;
  sprite.src = A.sprite;
  if (A.spriteShadow) {
    shadow = new Image(); shadow.onload = done; shadow.onerror = done; shadow.src = A.spriteShadow;
  }
} else {
  window.__sceneReady = true;
}
seedPix();
choreograph();

window.seek = (t) => {
  layout();
  const fadeOut = 1 - Anim.EASE.out(Math.min(1, Math.max(0, (t - (D - 0.6)) / 0.6)));
  const fadeIn = Anim.EASE.out(Math.min(1, Math.max(0, t / 0.35)));
  // Camera keys are in 1280x720 units; this canvas is BASE_W wide, so the travel converts with
  // it. Without this the same shot moved four times as far here as in every other template.
  const camUnit = BASE_W / 1280;
  const camX = q(t, CAM, "x", 0) * camUnit, camY = q(t, CAM, "y", 0) * camUnit;

  px(0, 0, BASE_W, BASE_H, C.bg);
  dither(0, 0, BASE_W, BASE_H, C.bg2);

  // parallax: background pixels drift half as far as the sprite
  ctx.globalAlpha = 0.55;
  for (const p of P) {
    const x = Math.round((p.x + camX * 0.35) % BASE_W);
    const y = Math.round((p.y + camY * 0.35 + Math.sin(t * 0.9 + p.ph) * 3)) % BASE_H;
    px((x + BASE_W) % BASE_W, (y + BASE_H) % BASE_H, p.s, p.s, C.dim2);
  }
  ctx.globalAlpha = 1;

  // sprite: stepped bob, whole-pixel hop on build beats, drift across the shot
  const size = S.spriteSize || [66, 98];
  const bw = size[0], bh = size[1];
  const hop = q(t, spriteY, "v", 46);
  const bob = (Math.floor(t * 4) % 2) === 1 ? -1 : 0;
  const sx = Math.round(224 - Math.min(t, Math.max(0, D - 0.6)) * 1.1 + camX * 0.75);
  const sy = Math.round(hop + bob + camY * 0.75);

  buf.width = bw; buf.height = bh;
  const bctx = buf.getContext("2d");
  bctx.imageSmoothingEnabled = false;
  bctx.clearRect(0, 0, bw, bh);
  if (ready && sprite) bctx.drawImage(sprite, 0, 0);

  // scan band stays inside the silhouette, quantised to whole pixels
  const scanOn = kinds("emphasis").some(b => t >= b.t && t < b.t + 1.35);
  if (ready && scanOn) {
    const y = q(t, scanY, "v", -14);
    const g = bctx.createLinearGradient(0, y - 7, 0, y + 7);
    g.addColorStop(0, "rgba(56,189,248,0)");
    g.addColorStop(0.5, "rgba(186,230,253,0.9)");
    g.addColorStop(1, "rgba(56,189,248,0)");
    bctx.globalCompositeOperation = "source-atop";
    bctx.fillStyle = g;
    bctx.fillRect(0, y - 7, bw, 14);
    bctx.globalCompositeOperation = "source-over";
  }
  if (ready && sprite) {
    ctx.globalAlpha = fadeOut;
    if (shadow) ctx.drawImage(shadow, sx + 2, sy + 1);
    ctx.drawImage(buf, sx, sy);
    ctx.globalAlpha = 1;
  }

  // impact: a palette flash in whole pixels
  for (const h of HITS) {
    const age = (t - h) / 0.22;
    if (age >= 0 && age < 1) {
      ctx.globalAlpha = (1 - age) * 0.35 * fadeOut;
      px(0, 0, BASE_W, BASE_H, C.accent2);
      ctx.globalAlpha = 1;
    }
  }

  // frame + corner ticks
  ctx.globalAlpha = Anim.EASE.out(Math.min(1, Math.max(0, t / 0.4))) * fadeOut;
  ctx.strokeStyle = C.border; ctx.lineWidth = 1;
  ctx.strokeRect(0.5, 0.5, BASE_W - 1, BASE_H - 1);
  px(2, 2, 6, 1, C.green); px(2, 2, 1, 6, C.green);
  px(BASE_W - 8, BASE_H - 3, 6, 1, C.green); px(BASE_W - 3, BASE_H - 8, 1, 6, C.green);
  ctx.globalAlpha = 1;

  // text: swaps on the movement beats instead of holding one line
  const swapBeat = kinds("transform").concat(kinds("shuffle"))[0];
  const showAlt = S.titleAlt && swapBeat && t > swapBeat.t + 0.25;
  const title = showAlt ? S.titleAlt : (S.title || "");
  const vanish = showAlt ? Math.min(1, (t - swapBeat.t - 0.25) / 0.3) : 1;

  ctx.globalAlpha = fadeOut;
  text(S.eyebrow || "PIXEL MODE", 14 + camX * 0.8, 20 + camY * 0.8, 7, C.dim);
  ctx.globalAlpha = Anim.EASE.out(Math.min(1, Math.max(0, (t - 0.38) / 0.5))) * fadeOut;
  text(title, Math.round(12 + camX), Math.round(30 + camY + (1 - vanish) * 3), 18, showAlt ? C.accent2 : C.text, "500");
  ctx.globalAlpha = fadeOut;
  px(14 + camX, 55 + camY, 64, 1, C.accent);
  ctx.globalAlpha = Anim.EASE.out(Math.min(1, Math.max(0, (t - 0.85) / 0.5))) * fadeOut;
  text(S.subtitle || "", Math.round(14 + camX), Math.round(62 + camY), 8, C.dim);
  if (S.cn) {
    ctx.globalAlpha = Anim.EASE.out(Math.min(1, Math.max(0, (t - 1.0) / 0.5))) * fadeOut;
    text(S.cn, Math.round(14 + camX), Math.round(78 + camY), 12, C.amber);
  }

  (S.rows || []).slice(0, 3).forEach((r, i) => {
    const pr = Math.min(1, Math.max(0, (t - (1.2 + i * 0.16)) / 0.5));
    const grow = Anim.EASE.out(pr);
    ctx.globalAlpha = grow * fadeOut;
    const y = Math.round(104 + i * 15 + camY);
    text(r.label || "", 14 + camX, y, 7, C.dim);
    px(64 + camX, y + 2, 44, 3, "#20263c");
    const pulse = 0.94 + 0.06 * Math.sin(t * 4 + i);
    px(64 + camX, y + 2, Math.round(44 * (r.weight === undefined ? 1 : r.weight) * grow * pulse), 3,
       r.color || C.accent2);
    text(r.value || "", 116 + camX, y, 7, "#cbd8ea");
  });

  if (S.chapter) {
    text(String(S.chapter.index).padStart(2, "0") + "/" + String(S.chapter.total).padStart(2, "0"),
         Math.round(250 + camX), Math.round(20 + camY), 7, C.dim2);
  }
  ctx.globalAlpha = Anim.EASE.out(Math.min(1, Math.max(0, (t - 1.7) / 0.5))) * fadeOut;
  text(S.footer || "", 14 + camX, 164 + camY, 7, C.dim2);

  // selection frame draws, then the label chip arrives
  const fp = Math.min(1, Math.max(0, (t - 4.3) / 0.8));
  ctx.globalAlpha = Anim.EASE.out(fp) * fadeOut;
  ctx.strokeStyle = C.accent2;
  ctx.setLineDash([4, 3]);
  ctx.lineDashOffset = -Math.round(t * 14);
  const fx = Math.round(216 + camX), fy = Math.round(39 + camY);
  ctx.strokeRect(fx + 0.5, fy + 0.5, 82, 112);
  ctx.setLineDash([]);
  if (S.callout && S.callout.c1) {
    ctx.globalAlpha = Anim.EASE.out(Math.min(1, Math.max(0, (t - 4.9) / 0.45))) * fadeOut;
    const lw = Math.round(ctx.measureText(S.callout.c1).width) + 8;
    px(fx - 10, fy - 15, lw + 8, 11, "#171b2c");
    ctx.strokeStyle = C.accent2; ctx.lineWidth = 1;
    ctx.strokeRect(fx - 9.5, fy - 14.5, lw + 7, 10);
    text(S.callout.c1, fx - 6, fy - 12, 7, C.accent2);
  }
  ctx.globalAlpha = 1;

  if (fadeIn < 1) { ctx.globalAlpha = 1 - fadeIn; px(0, 0, BASE_W, BASE_H, C.black); ctx.globalAlpha = 1; }
  if (fadeOut < 1) { ctx.globalAlpha = 1 - fadeOut; px(0, 0, BASE_W, BASE_H, C.black); ctx.globalAlpha = 1; }
};

window.seek(0);
</script>
</body>
</html>
