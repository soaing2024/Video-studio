<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #06080f; }
  #stage { position: absolute; inset: 0; }
</style>
</head>
<body>
<div id="stage"></div>
<script>
// quote: a statement card. Use it as a breather between busy sections.
const S = window.SCENE || {};
const D = S.duration || 6;
const stage = document.getElementById("stage");
const accent = S.accent || "#e0455f";
const COL = Object.assign({ bg: "#080c18", text: "#f6f8fc", dim: "#8f9db4" }, S.colors || {});
const clamp01 = (x) => Math.min(1, Math.max(0, x));
const easeOutCubic = (x) => 1 - Math.pow(1 - x, 3);

function hexA(hex, a) {
  const h = hex.replace("#", "");
  const n = parseInt(h.length === 3 ? h.split("").map(c => c + c).join("") : h, 16);
  return `rgba(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}, ${a})`;
}

let L = null;
function build() {
  const s = window.innerHeight / 720;
  stage.innerHTML = "";
  stage.style.background =
    `radial-gradient(${70 * s}% ${70 * s}% at 22% 30%, ${hexA(accent, 0.16)} 0%, ${hexA(accent, 0)} 58%),` +
    `linear-gradient(150deg, #0d1428 0%, ${COL.bg} 60%, #05070e 100%)`;
  const mk = (css, text) => {
    const n = document.createElement("div");
    Object.assign(n.style, css);
    if (text !== undefined) n.textContent = text;
    stage.appendChild(n);
    return n;
  };
  const bar = mk({ position: "absolute", left: `${132 * s}px`, top: `${196 * s}px`, width: `${5 * s}px`,
    height: "0", background: accent, borderRadius: `${3 * s}px`,
    boxShadow: `0 0 ${20 * s}px ${hexA(accent, 0.55)}` });
  const quote = mk({ position: "absolute", left: `${180 * s}px`, right: `${140 * s}px`, top: `${186 * s}px`,
    fontSize: `${(S.quoteSize || 46) * s}px`, lineHeight: "1.34", color: COL.text, opacity: "0",
    letterSpacing: `${0.4 * s}px` }, S.quote || "");
  const author = mk({ position: "absolute", left: `${182 * s}px`, top: `${520 * s}px`, opacity: "0",
    fontSize: `${20 * s}px`, color: accent }, S.author || "");
  const source = mk({ position: "absolute", left: `${182 * s}px`, top: `${552 * s}px`, opacity: "0",
    fontSize: `${14 * s}px`, color: COL.dim }, S.source || "");
  const footer = mk({ position: "absolute", left: `${182 * s}px`, top: `${650 * s}px`, opacity: "0",
    fontSize: `${12 * s}px`, letterSpacing: `${1 * s}px`, color: "#5d6b83" }, S.footer || "");
  return { bar, quote, author, source, footer, s };
}

L = build();
window.addEventListener("resize", () => { L = build(); });
window.__sceneReady = true;

window.seek = (t) => {
  const fadeOut = 1 - easeOutCubic(clamp01((t - (D - 0.5)) / 0.5));
  const p = clamp01((t - 0.3) / 0.8);
  L.bar.style.height = `${(300 * L.s * easeOutCubic(p)).toFixed(2)}px`;
  L.quote.style.opacity = (easeOutCubic(clamp01((t - 0.5) / 0.7)) * fadeOut).toFixed(4);
  L.quote.style.transform = `translateY(${((1 - easeOutCubic(clamp01((t - 0.5) / 0.7))) * 22 * L.s).toFixed(2)}px)`;
  L.author.style.opacity = (easeOutCubic(clamp01((t - 1.15) / 0.5)) * fadeOut).toFixed(4);
  L.source.style.opacity = (easeOutCubic(clamp01((t - 1.3) / 0.5)) * fadeOut).toFixed(4);
  L.footer.style.opacity = (0.9 * easeOutCubic(clamp01((t - 1.5) / 0.5)) * fadeOut).toFixed(4);
};

window.seek(0);
</script>
</body>
</html>
