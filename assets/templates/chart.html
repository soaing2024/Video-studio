<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #06080f; }
  #stage { position: absolute; inset: 0; }
  canvas { display: block; }
</style>
</head>
<body>
<div id="stage"></div>
<canvas id="plot"></canvas>
<script>
// chart: animated bar chart drawn on canvas. Data in, honest chart out.
const S = window.SCENE || {};
const D = S.duration || 10;
const stage = document.getElementById("stage");
const cv = document.getElementById("plot");
const ctx = cv.getContext("2d");
const accent = S.accent || "#e0455f";
const COL = Object.assign({ bg: "#080c18", text: "#f6f8fc", dim: "#8f9db4" }, S.colors || {});

const clamp01 = (x) => Math.min(1, Math.max(0, x));
const easeOutCubic = (x) => 1 - Math.pow(1 - x, 3);
const easeOutQuint = (x) => 1 - Math.pow(1 - x, 5);

function hexA(hex, a) {
  const h = hex.replace("#", "");
  const n = parseInt(h.length === 3 ? h.split("").map(c => c + c).join("") : h, 16);
  return `rgba(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}, ${a})`;
}

const SERIES = (S.series || []).slice(0, 12);
const CHART = S.chart || {};
const UNIT = CHART.unit || S.unit || "";
const MAXV = Number(CHART.max || Math.max(...SERIES.map((d) => Number(d.value) || 0), 1));
const COLORS = ["#e0455f", "#38bdf8", "#a78bfa", "#4ade80", "#fbbf24", "#f472b6"];

let L = null;
function build() {
  const s = window.innerHeight / 720;
  stage.innerHTML = "";
  stage.style.background =
    `radial-gradient(${60 * s}% ${60 * s}% at 12% 12%, ${hexA(accent, 0.14)} 0%, ${hexA(accent, 0)} 60%),` +
    `linear-gradient(160deg, #0d1428 0%, ${COL.bg} 60%, #05070e 100%)`;
  cv.width = window.innerWidth; cv.height = window.innerHeight;
  const mk = (css, text) => {
    const n = document.createElement("div");
    Object.assign(n.style, css);
    if (text !== undefined) n.textContent = text;
    stage.appendChild(n);
    return n;
  };
  const heading = mk({ position: "absolute", left: `${92 * s}px`, top: `${96 * s}px`, opacity: "0",
    fontSize: `${(S.titleSize || 40) * s}px`, fontWeight: "500", color: COL.text }, S.title || "");
  const sub = mk({ position: "absolute", left: `${94 * s}px`, top: `${152 * s}px`, opacity: "0",
    fontSize: `${17 * s}px`, color: COL.dim }, S.subtitle || "");
  const axisUnit = mk({ position: "absolute", left: `${92 * s}px`, top: `${198 * s}px`, opacity: "0",
    fontSize: `${13 * s}px`, letterSpacing: `${1.4 * s}px`, color: "#5d6b83" }, UNIT ? `单位：${UNIT}` : "");
  const footer = mk({ position: "absolute", left: `${92 * s}px`, top: `${650 * s}px`, opacity: "0",
    fontSize: `${12 * s}px`, color: "#5d6b83" }, S.footer || "");
  return { heading, sub, axisUnit, footer, s };
}

L = build();
window.addEventListener("resize", () => { L = build(); });
window.__sceneReady = true;

function draw(t, fadeOut) {
  const s = L.s;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.setTransform(s, 0, 0, s, 0, 0);

  const x0 = 150, x1 = 1180, y0 = 600, y1 = 250, plotW = x1 - x0, plotH = y0 - y1;
  const appear = easeOutCubic(clamp01((t - 0.35) / 0.6));
  ctx.globalAlpha = appear * fadeOut;

  ctx.lineWidth = 1;
  for (let g = 0; g <= 4; g++) {
    const y = y0 - (plotH * g) / 4;
    ctx.strokeStyle = g === 0 ? hexA("#94a3b8", 0.42) : hexA("#94a3b8", 0.14);
    ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke();
    ctx.fillStyle = hexA("#94a3b8", 0.85);
    ctx.font = "14px 'Microsoft YaHei UI', sans-serif";
    ctx.textAlign = "right"; ctx.textBaseline = "middle";
    ctx.fillText(((MAXV * g) / 4).toFixed(MAXV >= 100 ? 0 : 1), x0 - 14, y);
  }

  const n = SERIES.length || 1;
  const slot = plotW / n;
  const barW = Math.min(96, slot * 0.56);
  SERIES.forEach((d, i) => {
    const value = Number(d.value) || 0;
    const p = easeOutQuint(clamp01((t - (0.75 + i * 0.12)) / 0.7));
    const h = (plotH * value / MAXV) * p;
    const cx = x0 + slot * (i + 0.5);
    const color = d.color || COLORS[i % COLORS.length];
    ctx.fillStyle = color;
    ctx.fillRect(cx - barW / 2, y0 - h, barW, h);
    if (p > 0.02) {
      ctx.globalAlpha = Math.min(1, p * 1.3) * fadeOut;
      ctx.fillStyle = COL.text;
      ctx.font = "600 20px 'Microsoft YaHei UI', sans-serif";
      ctx.textAlign = "center"; ctx.textBaseline = "bottom";
      const shown = value >= 100 ? value.toFixed(0) : value.toFixed(1).replace(/\\.0$/, "");
      ctx.fillText(shown + UNIT, cx, y0 - h - 12);
      ctx.fillStyle = hexA("#94a3b8", 0.95);
      ctx.font = "16px 'Microsoft YaHei UI', sans-serif";
      ctx.textBaseline = "top";
      ctx.fillText(d.label || "", cx, y0 + 14);
      ctx.globalAlpha = appear * fadeOut;
    }
  });
  ctx.globalAlpha = 1;
}

window.seek = (t) => {
  const fadeOut = 1 - easeOutCubic(clamp01((t - (D - 0.5)) / 0.5));
  L.heading.style.opacity = (easeOutCubic(clamp01((t - 0.1) / 0.5)) * fadeOut).toFixed(4);
  L.sub.style.opacity = (easeOutCubic(clamp01((t - 0.35) / 0.5)) * fadeOut).toFixed(4);
  L.axisUnit.style.opacity = (easeOutCubic(clamp01((t - 0.45) / 0.5)) * fadeOut).toFixed(4);
  L.footer.style.opacity = (0.9 * easeOutCubic(clamp01((t - 0.8) / 0.5)) * fadeOut).toFixed(4);
  draw(t, fadeOut);
};

window.seek(0);
</script>
</body>
</html>
