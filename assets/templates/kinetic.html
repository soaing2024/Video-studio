<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #04060c; }
  #stage { position: absolute; inset: 0; }
  #particles { position: absolute; inset: 0; }
  .layer { position: absolute; inset: 0; will-change: transform; }
  .word { display: inline-block; will-change: transform, opacity; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="particles"></canvas>
  <div class="layer" id="layerBg"></div>
  <div class="layer" id="layerGhost"></div>
  <div class="layer" id="layerMid"></div>
  <div class="layer" id="layerFg"></div>
  <div class="layer" id="flash"></div>
</div>
<script src="../runtime/anim.js"></script>
<script src="../runtime/kit.js"></script>
<script src="../icons/lucide.js"></script>
<script src="../runtime/icons.js"></script>
<script>
// kinetic: shots are choreographed, not decorated. SCENE.choreography is a beat sheet; every beat
// moves material that is already on screen (transform, swap, reveal, count, shuffle) so the frame
// keeps changing state from the first frame to the last. Nothing is ever "entered and held".
const S = window.SCENE || {};
const V = S.visual || {};
const M = S.motion || {};
const CH = S.choreography || { beats: [{ t: 0, kind: "establish", intensity: 1 }], states: 1, max_gap: 0 };
const A = S.assets || {};
const D = S.duration || 8;

const C = Object.assign({
  bg: "#0b1020", surface: "#141a2c", border: "#2a3550", text: "#f8fafc",
  dim: "#93a3bd", accent: "#e0455f", accent2: "#38bdf8", accent3: "#a78bfa",
  series: ["#e0455f", "#38bdf8", "#a78bfa", "#4ade80"]
}, V.colors || {});

// Optional icons: `eyebrowIcon` and per-row `icon` name an icon from assets/icons/<set>.js
// (see `vs.py icons`). Nothing changes unless a field asks for it, and an unknown or missing
// icon simply draws nothing rather than failing the render.
const iconNode = (name, opts) => (name && window.Icons ? Icons.el(name, opts) : null);

const CAM = Object.assign({}, M.camera || {}, { duration: D });
const SHAKE = M.shake || { amp: 2, decay: 0.3, freq: 14 };
const DEPTH = M.depth || { bg: 0.3, mid: 0.75, fg: 1.15 };
const PARTICLES = M.particles || { count: 24, speed: 22, size: 2, opacity: 0.3, vertical: 8, mode: "dust" };
const SWEEP = M.sweep || { angle: 0, width: 200, speed: 380, opacity: 0.1 };
const PULSE = M.pulse || { freq: 1.1, amount: 0.015 };
const GHOST = M.ghost || { speed: 26, scale: 4, opacity: 0.05, dir: 1 };

const LAYOUT = V.layout || "editorial";
const DENSITY = V.density || "full";
const TS = V.type_scale || 1;
const TRACK = V.tracking || 0;
const RADIUS = V.radius === undefined ? 10 : V.radius;
const TEXTURE = V.texture || "none";
const TEX_AMOUNT = V.texture_amount || 0.1;
const VIGNETTE = V.vignette || 0.25;
const RULE_STYLE = V.rule_style || "bar";
const SUBJ_SCALE = V.subject_scale || 1;

const stage = document.getElementById("stage");
const cvP = document.getElementById("particles");
const ctxP = cvP.getContext("2d");
const layerBg = document.getElementById("layerBg");
const layerGhost = document.getElementById("layerGhost");
const layerMid = document.getElementById("layerMid");
const layerFg = document.getElementById("layerFg");
const flash = document.getElementById("flash");
const W = () => window.innerWidth, H = () => window.innerHeight;
const clamp01 = (x) => Math.min(1, Math.max(0, x));

function rgba(hex, a) {
  const h = String(hex).replace("#", "");
  const n = parseInt(h.length === 3 ? h.split("").map(c => c + c).join("") : h, 16);
  return `rgba(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}, ${a})`;
}
function el(parent, tag, css, text) {
  const n = document.createElement(tag);
  Object.assign(n.style, css);
  if (text !== undefined) n.textContent = text;
  parent.appendChild(n);
  return n;
}
function textureCss() {
  const line = rgba(C.border, 0.45);
  if (TEXTURE === "dots") return { backgroundImage: `radial-gradient(${line} 1px, transparent 1px)`, backgroundSize: "40px 40px" };
  if (TEXTURE === "grid") return { backgroundImage: `linear-gradient(${line} 1px, transparent 1px), linear-gradient(90deg, ${line} 1px, transparent 1px)`, backgroundSize: "64px 64px" };
  if (TEXTURE === "scanlines") return { backgroundImage: "repeating-linear-gradient(0deg, rgba(0,0,0,0.42) 0 1px, transparent 1px 4px)" };
  if (TEXTURE === "grain") return {
    backgroundImage: "url(\"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'>" +
      "<filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2'/></filter>" +
      "<rect width='140' height='140' filter='url(%23n)' opacity='0.6'/></svg>\")", backgroundRepeat: "repeat"
  };
  return {};
}

const LAYOUTS = {
  editorial: { text: { x: 88, y: 178, w: 620, align: "left" }, subject: { x: 110, y: 60, w: 400, h: 600, mode: "right" } },
  split:     { text: { x: 96, y: 226, w: 548, align: "left" }, subject: { x: 92, y: 60, w: 528, h: 600, mode: "right" } },
  center:    { text: { x: 200, y: 210, w: 880, align: "center" }, subject: { x: 0, y: 0, w: 1280, h: 720, mode: "cover" } },
  corner:    { text: { x: 96, y: 388, w: 700, align: "left" }, subject: { x: 78, y: 36, w: 300, h: 440, mode: "right" } },
  fullbleed: { text: { x: 96, y: 356, w: 920, align: "left" }, subject: { x: 0, y: 0, w: 1280, h: 720, mode: "cover" } },
  banner:    { text: { x: 150, y: 232, w: 980, align: "center" }, subject: { x: 44, y: 40, w: 232, h: 348, mode: "right" } }
};

let P = [];
function seedParticles() {
  const s = H() / 720;
  let h = String(S.id || "seed").split("").reduce((a, c) => (a * 31 + c.charCodeAt(0)) % 100000, 7);
  const rnd = () => { h = (h * 1103515245 + 12345) % 2147483648; return h / 2147483648; };
  P = Array.from({ length: PARTICLES.count }, () => ({
    x: rnd() * W(), y: rnd() * H(), r: (0.5 + rnd()) * PARTICLES.size * s,
    dx: (0.5 + rnd()) * PARTICLES.speed * s * (PARTICLES.mode === "streak" ? 3.2 : 1),
    dy: (rnd() - 0.5) * PARTICLES.vertical * s, a: (0.4 + rnd() * 0.8) * PARTICLES.opacity, ph: rnd() * 6.28
  }));
}

function splitWords(text) {
  const parts = String(text || "").split(/(\s+)/).filter(Boolean);
  if (parts.length >= 2 && String(text).indexOf(" ") !== -1) return parts;
  const chars = Array.from(String(text || ""));
  const out = [];
  for (let i = 0; i < chars.length; i += 2) out.push(chars.slice(i, i + 2).join(""));
  return out;
}

let L = null, scene = null, subjects = {};

function build() {
  const s = H() / 720;
  const lay = LAYOUTS[LAYOUT] || LAYOUTS.editorial;
  [layerBg, layerGhost, layerMid, layerFg, flash].forEach(l => { l.innerHTML = ""; });
  cvP.width = W(); cvP.height = H();
  seedParticles();
  stage.style.background = `linear-gradient(160deg, ${C.bg} 0%, ${rgba(C.bg, 0.88)} 55%, #04060c 100%)`;

  scene = new Anim.Scene();
  const beats = CH.beats || [];
  const at = (kind, nth) => {
    const hits = beats.filter(b => b.kind === kind);
    return hits[nth || 0] || null;
  };
  const intensityOf = (b) => (b && b.intensity) || 1;

  // ---------- background ----------
  const tex = el(layerBg, "div", Object.assign({ position: "absolute", inset: "0", opacity: "0" }, textureCss()));
  const halo = el(layerBg, "div", { position: "absolute", right: `${20 * s}px`, top: `${-60 * s}px`,
    width: `${820 * s}px`, height: `${860 * s}px`, opacity: "0", pointerEvents: "none",
    background: `radial-gradient(closest-side, ${rgba(C.accent, 0.30)}, ${rgba(C.accent, 0)} 70%)` });
  const sweep = el(layerBg, "div", { position: "absolute", top: `${-40 * s}%`, height: `${180 * s}%`,
    width: `${SWEEP.width * s}px`, opacity: "0", pointerEvents: "none",
    background: `linear-gradient(90deg, ${rgba(C.text, 0)}, ${rgba(C.text, SWEEP.opacity)}, ${rgba(C.text, 0)})`,
    filter: `blur(${18 * s}px)`, transform: `rotate(${SWEEP.angle}deg)` });
  const vign = el(layerBg, "div", { position: "absolute", inset: "0", opacity: "0", pointerEvents: "none",
    background: `radial-gradient(78% 78% at 50% 46%, rgba(0,0,0,0) 42%, rgba(0,0,0,${VIGNETTE}) 100%)` });
  const blobs = Kit.backdrop(layerBg, { color: C.accent, alpha: 0.10, count: 3, blur: 26, scale: s,
                                     width: 1280, height: 720, duration: D,
                                     seed: (S.id || "kinetic") + "-bg" });

  // ghost type: a large word that keeps travelling for the whole shot
  let ghostNode = null;
  if (GHOST.text) {
    ghostNode = el(layerGhost, "div", { position: "absolute", top: `${50 * s}%`, whiteSpace: "nowrap",
      fontSize: `${120 * GHOST.scale * s}px`, fontWeight: "700", letterSpacing: `${-2 * s}px`,
      color: rgba(C.text, GHOST.opacity), transform: "translateY(-50%)", opacity: "1" }, GHOST.text);
  }

  // ---------- motif: one shape that lives the whole shot and keeps changing form ----------
  const motif = el(layerMid, "div", { position: "absolute", opacity: "0",
    background: C.accent, borderRadius: `${RADIUS * s}px`, willChange: "transform, opacity, border-radius",
    mixBlendMode: "screen" });
  const mSize = 150 * s;
  Object.assign(motif.style, { width: `${mSize}px`, height: `${mSize}px`,
    left: `${(lay.subject.mode === "cover" ? 120 : lay.text.x + 30) * s}px`, top: `${170 * s}px` });
  const motifA = scene.actor(motif, { opacity: 0, scale: 0.6, rot: -24, radius: RADIUS * s, width: mSize, height: mSize },
                             { origin: "50% 50%" });

  // ---------- subject plate ----------
  const plate = el(layerMid, "div", { position: "absolute", opacity: "0", overflow: "hidden",
    borderRadius: `${RADIUS * s}px`, backgroundSize: "contain", backgroundRepeat: "no-repeat",
    backgroundPosition: "center" });
  const cover = lay.subject.mode === "cover";
  if (cover) Object.assign(plate.style, { left: "0px", top: "0px", width: "100%", height: "100%" });
  else Object.assign(plate.style, {
    left: `${(W() - (lay.subject.x + lay.subject.w) * s).toFixed(1)}px`, top: `${lay.subject.y * s}px`,
    width: `${lay.subject.w * s}px`, height: `${lay.subject.h * s}px` });
  const scrim = cover ? el(layerMid, "div", { position: "absolute", inset: "0", opacity: "0", pointerEvents: "none",
      background: LAYOUT === "fullbleed"
        ? "linear-gradient(0deg, rgba(4,6,12,0.90) 0%, rgba(4,6,12,0.62) 40%, rgba(4,6,12,0.18) 72%)"
        : "radial-gradient(78% 78% at 50% 45%, rgba(4,6,12,0.52) 0%, rgba(4,6,12,0.42) 62%, rgba(4,6,12,0.68) 100%)" })
    : null;
  const plateA = scene.actor(plate, { opacity: 0, scale: cover ? 1.04 : 0.94, y: 46, clip: 0 });
  const scrimA = scrim ? scene.actor(scrim, { opacity: 0 }) : null;

  // ---------- foreground type ----------
  const tx = lay.text.x * s, ty = lay.text.y * s, tw = lay.text.w * s;
  const eyebrowEl = el(layerFg, "div", { position: "absolute", top: "0px", width: "100%", opacity: "0",
    fontSize: `${12 * s}px`, letterSpacing: `${3 * s}px`, color: C.dim, textAlign: lay.text.align }, S.eyebrow || "");
  const eyebrowIcon = iconNode(S.eyebrowIcon, { size: 15 * s, color: C.accent, width: 2 });
  if (eyebrowIcon) {
    // The eyebrow is anchored to the frame rather than the text column, so under the camera's
    // push a glyph hung on the wrong side can sit outside the safe area. Put it on the side the
    // text itself is aligned to.
    const align = lay.text.align;
    Object.assign(eyebrowEl.style, { display: "flex", alignItems: "center", gap: `${8 * s}px`,
      justifyContent: align === "center" ? "center" : (align === "right" ? "flex-end" : "flex-start") });
    if (align === "right") eyebrowEl.appendChild(eyebrowIcon);
    else eyebrowEl.insertBefore(eyebrowIcon, eyebrowEl.firstChild);
  }

  const titleBox = el(layerFg, "div", { position: "absolute", top: `${(ty + 24 * s)}px`, left: `${tx}px`,
    width: `${tw}px`, fontSize: `${(S.titleSize || 56) * TS * s}px`, fontWeight: "500",
    letterSpacing: `${TRACK * s}px`, lineHeight: "1.12", color: C.text, textAlign: lay.text.align });
  const altBox = S.titleAlt ? el(layerFg, "div", { position: "absolute", top: `${(ty + 24 * s)}px`, left: `${tx}px`,
    width: `${tw}px`, fontSize: `${(S.titleSize || 56) * TS * s}px`, fontWeight: "500",
    letterSpacing: `${TRACK * s}px`, lineHeight: "1.12", color: C.accent, textAlign: lay.text.align,
    opacity: "0" }) : null;

  const wordActors = splitWords(S.title).map((piece, i) => {
    const span = document.createElement("span");
    span.className = "word";
    span.textContent = piece;
    titleBox.appendChild(span);
    return { actor: scene.actor(span, { opacity: 0, y: 74, scale: 0.92, blur: 10 }), i, piece };
  });
  const altActors = altBox ? splitWords(S.titleAlt).map((piece) => {
    const span = document.createElement("span");
    span.className = "word";
    span.textContent = piece;
    altBox.appendChild(span);
    return { actor: scene.actor(span, { opacity: 0, y: 62, scale: 0.94, blur: 8 }) };
  }) : [];

  const rule = el(layerFg, "div", { position: "absolute", opacity: "0", background: C.accent });
  const sub = el(layerFg, "div", { position: "absolute", width: "100%", opacity: "0",
    top: `${(24 + 54 * TS + 20) * s}px`, fontSize: `${15 * s}px`, letterSpacing: `${0.6 * s}px`,
    color: C.dim, textAlign: lay.text.align }, S.subtitle || "");
  const rowsTop = 24 + 54 * TS + 58;
  const rowData = (S.rows || []).slice(0, 4);
  const rowActors = rowData.map((r, i) => {
    const wrap = el(layerFg, "div", { position: "absolute", top: `${(rowsTop + i * 54) * s}px`, opacity: "0",
      left: lay.text.align === "center" ? "50%" : "0px", textAlign: lay.text.align });
    if (lay.text.align === "center") wrap.style.marginLeft = `-${90 * s}px`;
    const lab = el(wrap, "div", { fontSize: `${11 * s}px`, letterSpacing: `${2 * s}px`, color: C.dim, textAlign: lay.text.align }, r.label || "");
    const labIcon = iconNode(r.icon, { size: 13 * s, color: r.color || C.accent, width: 2 });
    if (labIcon) {
      const align = lay.text.align;   // same side rule as the eyebrow, for the same reason
      Object.assign(lab.style, { display: "flex", alignItems: "center", gap: `${7 * s}px`,
        justifyContent: align === "center" ? "center" : (align === "right" ? "flex-end" : "flex-start") });
      if (align === "right") lab.appendChild(labIcon);
      else lab.insertBefore(labIcon, lab.firstChild);
    }
    const val = el(wrap, "div", { fontSize: `${18 * s}px`, color: C.text, marginTop: `${5 * s}px`, whiteSpace: "nowrap" }, r.value || "");
    const track = el(wrap, "div", { marginTop: `${8 * s}px`, width: `${180 * s}px`, height: `${4 * s}px`,
      background: rgba(C.border, 0.5), borderRadius: `${3 * s}px`, overflow: "hidden" });
    const fill = el(track, "div", { height: "100%", width: "0px", background: r.color || C.series[i % C.series.length] });
    return {
      wrapA: scene.actor(wrap, { opacity: 0, x: -34 }),
      fillA: scene.actor(fill, { width: 0, opacity: 1 }),
      weight: r.weight === undefined ? 1 : r.weight, val, i
    };
  });

  const callout = el(layerFg, "div", { position: "absolute", opacity: "0",
    top: `${(rowsTop + Math.min(rowActors.length, 4) * 54 + 14) * s}px`,
    borderLeft: `${2 * s}px solid ${C.accent2}`, paddingLeft: `${12 * s}px` });
  el(callout, "div", { fontSize: `${12 * s}px`, color: C.text }, (S.callout && S.callout.c1) || "");
  el(callout, "div", { fontSize: `${11 * s}px`, color: C.dim, marginTop: `${4 * s}px` }, (S.callout && S.callout.c2) || "");
  const footer = el(layerFg, "div", { position: "absolute", opacity: "0", fontSize: `${11 * s}px`,
    letterSpacing: `${s}px`, color: C.dim, left: `${tx}px`, top: `${662 * s}px` }, S.footer || "");
  const chip = el(layerFg, "div", { position: "absolute", opacity: "0", fontSize: `${12 * s}px`,
    letterSpacing: `${2 * s}px`, color: C.accent, left: `${tx}px`, top: `${58 * s}px` },
    S.chapter ? String(S.chapter.index).padStart(2, "0") + " / " + String(S.chapter.total).padStart(2, "0") : "");

  const eyebrowA = scene.actor(eyebrowEl, { opacity: 0, y: -14 });
  const ruleA = scene.actor(rule, { opacity: 0, width: 0 });
  const subA = scene.actor(sub, { opacity: 0, y: 22 });
  const calloutA = scene.actor(callout, { opacity: 0, x: -20 });
  const footerA = scene.actor(footer, { opacity: 0 });
  const chipA = scene.actor(chip, { opacity: 0, y: -10 });

  let ruleW = 168 * s, ruleH = 3 * s;
  if (RULE_STYLE === "dot") { ruleW = 14 * s; ruleH = 14 * s; rule.style.borderRadius = "50%"; }
  else if (RULE_STYLE === "bracket") {
    ruleW = 34 * s; ruleH = 34 * s;
    Object.assign(rule.style, { background: "transparent", borderLeft: `${4 * s}px solid ${C.accent}`,
      borderTop: `${4 * s}px solid ${C.accent}` });
  } else rule.style.borderRadius = `${3 * s}px`;
  Object.assign(rule.style, { top: `${(ty + 24 * s + 54 * TS * s + 6 * s)}px`,
    left: `${tx + (lay.text.align === "center" ? (tw - ruleW) / 2 : 0)}px`, width: "0px", height: `${ruleH}px` });

  if (DENSITY === "minimal") {
    rowActors.forEach(r => { r.wrapA.node.style.display = "none"; });
    callout.style.display = "none";
    footer.style.display = "none";
  }

  // Camera as a keyframed actor too: one waypoint per beat, so it is always travelling.
  const camActor = new Anim.Actor(document.createElement("div"),
                                 { x: 0, y: 0, scale: 1, rot: 0, opacity: 1 });
  const track = (M.camera_track && M.camera_track.length) ? M.camera_track : null;
  if (track) {
    for (const wp of track) {
      camActor.to({ x: wp.x, y: wp.y, scale: wp.scale, rot: wp.rot },
                  { at: wp.t, dur: wp.dur, ease: wp.ease, arc: wp.arc, spring: 0.35, damping: 0.75 });
    }
  } else {
    camActor.to({ scale: CAM.scale_to || 1.04, x: CAM.x_to || 0, y: CAM.y_to || 0 },
                { at: 0, dur: D, ease: "inout" });
  }
  const camLayers = [{ node: layerBg, depth: DEPTH.bg }, { node: layerGhost, depth: DEPTH.bg * 0.8 },
                     { node: layerMid, depth: DEPTH.mid }, { node: layerFg, depth: DEPTH.fg }];
  const camHits = beats.filter(b => b.kind === "emphasis").map(b => b.t);

  // ---------------- choreography: schedule the actors -------------------------------
  const stagger = 0.055 + 0.05 * Math.random() * 0;   // deterministic: keep 0
  const wStagger = 0.075;

  const establish = at("establish") || { t: 0, intensity: 1 };
  const e0 = establish.t;
  wordActors.forEach((w, i) => {
    w.actor.to({ opacity: 1, y: 0, scale: 1, blur: 0 },
               { at: e0 + 0.12 + i * wStagger, dur: 0.85, spring: 0.55, damping: 0.62,
                 arc: (i % 2 ? 14 : -14), anticipation: 0.18 });
  });
  eyebrowA.to({ opacity: 1, y: 0 }, { at: e0 + 0.05, dur: 0.5, ease: "out", arc: 8 });
  ruleA.to({ opacity: 1, width: ruleW }, { at: e0 + 0.45, dur: 0.7, ease: "back" });
  subA.to({ opacity: 1, y: 0 }, { at: e0 + 0.7, dur: 0.6, spring: 0.6, damping: 0.7 });
  chipA.to({ opacity: 0.9, y: 0 }, { at: e0 + 0.2, dur: 0.5, ease: "out" });
  motifA.to({ opacity: 0.16, scale: 1, rot: 0, radius: RADIUS * s },
            { at: e0 + 0.1, dur: 1.4, ease: "out", arc: 30 });
  plateA.to({ opacity: cover ? 0.62 : 1, scale: cover ? 1.02 : SUBJ_SCALE, y: 0, clip: 1 },
            { at: e0 + 0.35, dur: 1.1, ease: "out", arc: 18 });
  if (scrimA) scrimA.to({ opacity: 1 }, { at: e0 + 0.5, dur: 0.8, ease: "out" });
  footerA.to({ opacity: 0.9 }, { at: e0 + 0.9, dur: 0.6 });

  // every remaining beat moves what is already on screen
  beats.filter(b => !["establish", "exit"].includes(b.kind)).forEach((b, n) => {
    const k = b.kind, I = intensityOf(b);
    if (k === "build") {
      rowActors.forEach((r, i) => {
        r.wrapA.to({ opacity: 1, x: 0 }, { at: b.t + i * stagger, dur: 0.5, ease: "out", anticipation: 0.15 });
        r.fillA.to({ width: 180 * s * r.weight * Math.min(1.15, I) },
                   { at: b.t + 0.08 + i * stagger, dur: 0.75, spring: 0.5, damping: 0.55 });
      });
      calloutA.to({ opacity: 1, x: 0 }, { at: b.t + 0.3, dur: 0.6, ease: "out", arc: 10 });
    } else if (k === "transform") {
      const grow = 1.1 + 0.5 * I;
      motifA.to({ scale: Math.min(3.4, grow), rot: 24 + 40 * I,
                  radius: (n % 2 ? 999 : 14) * s, opacity: 0.1 + 0.12 * I },
                { at: b.t, dur: 0.9, ease: "back", arc: 40 });
      wordActors.forEach((w, i) => w.actor.to({ y: i % 2 ? -6 : 6, scale: 1.02 },
                { at: b.t + i * 0.02, dur: 0.5, ease: "out" }));
    } else if (k === "swap" && altActors.length) {
      wordActors.forEach((w, i) => w.actor.to({ opacity: 0, y: -40, blur: 8 },
                { at: b.t + i * 0.03, dur: 0.32, ease: "in" }));
      altActors.forEach((w, i) => w.actor.to({ opacity: 1, y: 0, blur: 0, scale: 1 },
                { at: b.t + 0.18 + i * 0.06, dur: 0.6, spring: 0.6, damping: 0.6, arc: -12 }));
    } else if (k === "emphasis") {
      motifA.to({ scale: 1.35 * I, rot: 60 * n, opacity: 0.22 },
                { at: b.t, dur: 0.45, spring: 0.8, damping: 0.45 });
      plateA.to({ scale: (cover ? 1.02 : SUBJ_SCALE) * (1 + 0.03 * I) },
                { at: b.t, dur: 0.5, ease: "back" });
      rowActors.forEach((r, i) => r.fillA.to({ width: 180 * s * r.weight * (1 + 0.08 * I) },
                { at: b.t + i * 0.03, dur: 0.5, spring: 0.7, damping: 0.4 }));
    } else if (k === "parallax_drift") {
      const dx = (n % 2 ? 1 : -1) * (18 + 26 * I);
      plateA.to({ x: dx, rot: (n % 2 ? 1 : -1) * 1.2 }, { at: b.t, dur: 1.6, ease: "inout", arc: 26 });
      rowActors.forEach((r, i) => r.wrapA.to({ x: dx * 0.25 }, { at: b.t + i * 0.04, dur: 1.4, ease: "inout" }));
      rowActors.forEach(r => r.fillA.to({ width: 180 * s * r.weight * 0.92 },
                { at: b.t + 0.2, dur: 0.7, ease: "inout" }));
    } else if (k === "reveal") {
      plateA.to({ clip: 0, x: 0 }, { at: b.t, dur: 0.75, ease: "inout" });
      plateA.to({ clip: 1 }, { at: b.t + 0.75, dur: 0.6, ease: "out" });
    } else if (k === "count") {
      rowActors.forEach((r, i) => r.wrapA.to({ x: -8 + 16 * (i % 2) }, { at: b.t, dur: 0.4, ease: "out" }));
    } else if (k === "shuffle") {
      rowActors.forEach((r, i) => {
        const to = rowData.length > 1 ? ((i + 1) % rowData.length) : i;
        r.wrapA.to({ y: (to - i) * 54 * s, x: 10 }, { at: b.t, dur: 0.8, ease: "back", arc: 40 });
      });
      rowActors.forEach((r, i) => r.wrapA.to({ y: 0, x: 0 },
                { at: b.t + 1.5, dur: 0.6, ease: "out" }));
    }
  });

  // exit beat: anticipation before the cut, so the shot does not just stop
  const ex = at("exit");
  if (ex) {
    wordActors.forEach((w, i) => w.actor.to({ y: -14, scale: 0.985 }, { at: ex.t, dur: 0.42, ease: "in" }));
    plateA.to({ scale: (cover ? 1.02 : SUBJ_SCALE) * 0.985 }, { at: ex.t, dur: 0.42, ease: "in" });
    motifA.to({ scale: 0.94, opacity: 0.08 }, { at: ex.t, dur: 0.42, ease: "in" });
  }

  return { s, lay, tex, halo, sweep, vign, ghost: ghostNode, motif: motifA, plateA, scrimA,
           eyebrowA, ruleA, subA, rowActors, calloutA, footerA, chipA, plate, scrim,
           wordActors, altActors, cover, tx, ty, tw, ruleW, ruleH,
           camActor, camLayers, camHits, blobs };
}

L = build();
window.addEventListener("resize", () => { L = build(); });

let subject = null, subjectReady = false;
if (A.subject) {
  subject = new Image();
  subject.onload = () => { subjectReady = true; window.__sceneReady = true; };
  subject.onerror = () => { subjectReady = true; window.__sceneReady = true; };
  subject.src = A.subject;
} else {
  window.__sceneReady = true;
}

window.seek = (t) => {
  const s = L.s;
  const fadeOut = 1 - Anim.EASE.out(clamp01((t - (D - 0.45)) / 0.45));

  if (subjectReady && subject && !L.plate.style.backgroundImage) {
    L.plate.style.backgroundImage = `url("${subject.src}")`;
    L.plate.style.backgroundSize = L.cover ? "cover" : "contain";
    if (L.cover) L.plate.style.filter = "brightness(0.8) saturate(0.98)";
  }

  // camera: keyframed travel + impact punch, applied per layer for parallax
  const cam = L.camActor.sample(t);
  L.blobs.forEach(b => b.render(t));
  let bump = 0;
  for (const h of L.camHits) {
    if (t <= h) continue;
    const k = (t - h) / SHAKE.decay;
    if (k < 1) bump += Math.exp(-3.2 * k);
  }
  bump = Math.min(2.4, bump);
  const sx = (Math.sin(t * SHAKE.freq) + 0.5 * Math.sin(t * SHAKE.freq * 2.3 + 1.1)) * SHAKE.amp * bump;
  const sy = (Math.cos(t * SHAKE.freq * 1.3) + 0.5 * Math.sin(t * SHAKE.freq * 3.1)) * SHAKE.amp * 0.7 * bump;
  const camScale = (cam.scale || 1) * (1 + 0.022 * bump);
  for (const lay of L.camLayers) {
    const d = lay.depth;
    lay.node.style.transform =
      `translate3d(${((cam.x || 0) * d + sx).toFixed(2)}px, ${((cam.y || 0) * d + sy).toFixed(2)}px, 0) ` +
      `scale(${(1 + (camScale - 1) * d).toFixed(5)}) rotate(${((cam.rot || 0) * d).toFixed(3)}deg)`;
  }
  scene.seek(t, null);

  // frame-level accents driven by the impact response
  L.tex.style.opacity = (Math.min(0.85, TEX_AMOUNT * 3.2) * Anim.EASE.out(clamp01(t / 0.9))).toFixed(4);
  L.vign.style.opacity = (Anim.EASE.out(clamp01(t / 1.2)) * fadeOut).toFixed(4);
  const breathe = 1 + PULSE.amount * Math.sin(t * PULSE.freq * 6.283);
  L.halo.style.opacity = (0.5 * breathe * Anim.EASE.out(clamp01(t / 1.2)) * fadeOut).toFixed(4);
  const sw = ((t * SWEEP.speed) % (W() * 2.2)) - W() * 1.1;
  L.sweep.style.left = `${sw.toFixed(1)}px`;
  L.sweep.style.opacity = (SWEEP.opacity * 4 * fadeOut).toFixed(4);
  if (L.ghost) {
    const span = W() * 2.4;
    const gx = GHOST.dir > 0 ? ((t * GHOST.speed) % span) - span * 0.7 : span * 0.7 - ((t * GHOST.speed) % span);
    L.ghost.style.left = `${gx.toFixed(1)}px`;
  }

  flash.style.background = `radial-gradient(120% 120% at 50% 50%, ${rgba(C.accent, 0.5)}, ${rgba(C.accent, 0)} 60%)`;
  flash.style.opacity = (Math.min(0.45, bump * 0.3) * fadeOut).toFixed(4);
  flash.style.mixBlendMode = "screen";

  ctxP.setTransform(1, 0, 0, 1, 0, 0);
  ctxP.clearRect(0, 0, cvP.width, cvP.height);
  ctxP.globalAlpha = fadeOut;
  for (const q of P) {
    const x = (q.x + q.dx * t) % (W() + 40) - 20;
    const y = (q.y + q.dy * t + 8 * Math.sin(t * 0.7 + q.ph)) % (H() + 40) - 20;
    ctxP.fillStyle = rgba(C.text, q.a * (0.6 + 0.4 * Math.sin(t * 1.7 + q.ph)));
    if (PARTICLES.mode === "streak") ctxP.fillRect(x, y, q.r * 5.5, Math.max(1, q.r * 0.7));
    else ctxP.beginPath(), ctxP.arc(x, y, q.r, 0, 6.283), ctxP.fill();
  }
  ctxP.globalAlpha = 1;

  // fade out of the shot itself
  if (fadeOut < 1) {
    layerFg.style.opacity = fadeOut.toFixed(4);
    layerMid.style.opacity = fadeOut.toFixed(4);
  } else {
    layerFg.style.opacity = "1";
    layerMid.style.opacity = "1";
  }
};

window.seek(0);
</script>
</body>
</html>
