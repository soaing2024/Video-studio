<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #05070d; }
  #stage { position: absolute; inset: 0; }
</style>
</head>
<body>
<div id="stage"></div>
<script>
// kinetic: one template, many compositions. `SCENE.visual` carries a resolved direction
// (layout, motion family, palette, texture) so the same source looks different every seed.
const S = window.SCENE || {};
const V = S.visual || {};
const A = S.assets || {};
const D = S.duration || 8;

const C = Object.assign({
  bg: "#0b1020", surface: "#141a2c", border: "#2a3550", text: "#f8fafc",
  dim: "#93a3bd", accent: "#e0455f", accent2: "#38bdf8", accent3: "#a78bfa",
  series: ["#e0455f", "#38bdf8", "#a78bfa", "#4ade80"]
}, V.colors || {});
const MO = V.motion_spec || { from: { y: 42, opacity: 0 }, ease: "cubic" };
const LAYOUT = V.layout || "editorial";
const DENSITY = V.density || "full";
const SPEED = V.speed || 1;
const STAGGER = V.stagger || 0.14;
const TS = V.type_scale || 1;
const TRACK = V.tracking || 0;
const RADIUS = V.radius === undefined ? 10 : V.radius;
const TEXTURE = V.texture || "none";
const TEX_AMOUNT = V.texture_amount || 0.1;
const VIGNETTE = V.vignette || 0.25;
const RULE_STYLE = V.rule_style || "bar";
const SUBJ_SCALE = V.subject_scale || 1;

const stage = document.getElementById("stage");
const W = () => window.innerWidth, H = () => window.innerHeight;

const clamp01 = (x) => Math.min(1, Math.max(0, x));
const EASE = {
  cubic: (x) => 1 - Math.pow(1 - x, 3),
  quint: (x) => 1 - Math.pow(1 - x, 5),
  expo: (x) => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x),
  back: (x) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); }
};
const easeOut = EASE.cubic;

// Composition presets. Coordinates are authored for 1280x720 and scaled by s.
const LAYOUTS = {
  editorial: { text: { x: 88, y: 178, w: 620, align: "left" },
               subject: { x: 110, y: 60, w: 400, h: 600, mode: "right" } },
  split:     { text: { x: 96, y: 226, w: 548, align: "left" },
               subject: { x: 92, y: 60, w: 528, h: 600, mode: "right" } },
  center:    { text: { x: 200, y: 210, w: 880, align: "center" },
               subject: { x: 0, y: 0, w: 1280, h: 720, mode: "cover" } },
  corner:    { text: { x: 96, y: 388, w: 700, align: "left" },
               subject: { x: 78, y: 36, w: 300, h: 440, mode: "right" } },
  fullbleed: { text: { x: 96, y: 356, w: 920, align: "left" },
               subject: { x: 0, y: 0, w: 1280, h: 720, mode: "cover" } },
  banner:    { text: { x: 150, y: 232, w: 980, align: "center" },
               subject: { x: 44, y: 40, w: 232, h: 348, mode: "right" } }
};

function rgba(hex, a) {
  const h = String(hex).replace("#", "");
  const n = parseInt(h.length === 3 ? h.split("").map(c => c + c).join("") : h, 16);
  return `rgba(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}, ${a})`;
}

function el(tag, css, text) {
  const n = document.createElement(tag);
  Object.assign(n.style, css);
  if (text !== undefined) n.textContent = text;
  stage.appendChild(n);
  return n;
}

function textureCss() {
  const line = rgba(C.border, 0.45);
  if (TEXTURE === "dots") {
    return { backgroundImage: `radial-gradient(${line} 1px, transparent 1px)`, backgroundSize: "40px 40px" };
  }
  if (TEXTURE === "grid") {
    return { backgroundImage: `linear-gradient(${line} 1px, transparent 1px), linear-gradient(90deg, ${line} 1px, transparent 1px)`,
             backgroundSize: "64px 64px" };
  }
  if (TEXTURE === "scanlines") {
    return { backgroundImage: `repeating-linear-gradient(0deg, rgba(0,0,0,0.42) 0 1px, transparent 1px 4px)` };
  }
  if (TEXTURE === "grain") {
    return {
      backgroundImage: "url(\"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'>" +
        "<filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2'/></filter>" +
        "<rect width='140' height='140' filter='url(%23n)' opacity='0.6'/></svg>\")",
      backgroundRepeat: "repeat"
    };
  }
  return {};
}

function build() {
  const s = H() / 720;
  const L = LAYOUTS[LAYOUT] || LAYOUTS.editorial;
  stage.innerHTML = "";
  stage.style.background = `linear-gradient(160deg, ${C.bg} 0%, ${rgba(C.bg, 0.88)} 55%, #04060c 100%)`;

  const bgLayer = el("div", Object.assign({ position: "absolute", inset: "0", opacity: "0",
    backgroundSize: "40px 40px" }, textureCss()));
  const halo = el("div", { position: "absolute", right: `${20 * s}px`, top: `${-60 * s}px`,
    width: `${820 * s}px`, height: `${860 * s}px`, opacity: "0", pointerEvents: "none",
    background: `radial-gradient(closest-side, ${rgba(C.accent, 0.28)}, ${rgba(C.accent, 0)} 70%)` });
  const vign = el("div", { position: "absolute", inset: "0", opacity: "0", pointerEvents: "none",
    background: `radial-gradient(78% 78% at 50% 46%, rgba(0,0,0,0) 42%, rgba(0,0,0,${VIGNETTE}) 100%)` });

  const plate = el("div", { position: "absolute", opacity: "0", overflow: "hidden",
    borderRadius: `${RADIUS * s}px`, transformOrigin: "50% 100%", backgroundSize: "contain",
    backgroundRepeat: "no-repeat", backgroundPosition: "center" });

  // The scrim has to sit between the image and the words, otherwise it dims the text too.
  const scrim = (L.subject.mode === "cover")
    ? el("div", { position: "absolute", inset: "0", opacity: "0", pointerEvents: "none",
        background: LAYOUT === "fullbleed"
          ? "linear-gradient(0deg, rgba(4,6,12,0.90) 0%, rgba(4,6,12,0.62) 40%, rgba(4,6,12,0.18) 72%)"
          : "radial-gradient(78% 78% at 50% 45%, rgba(4,6,12,0.52) 0%, rgba(4,6,12,0.42) 62%, rgba(4,6,12,0.68) 100%)" })
    : null;

  // ---- text block ----
  const block = el("div", { position: "absolute", opacity: "1" });
  const eyebrow = el("div", { position: "absolute", top: "0px", width: "100%", opacity: "0",
    fontSize: `${12 * s}px`, letterSpacing: `${3 * s}px`, color: C.dim,
    textAlign: L.text.align }, S.eyebrow || "");
  const title = el("div", { position: "absolute", width: "100%", opacity: "0",
    top: `${24 * s}px`, fontSize: `${(S.titleSize || 56) * TS * s}px`, fontWeight: "500",
    letterSpacing: `${TRACK * s}px`, lineHeight: "1.12", color: C.text,
    textAlign: L.text.align }, S.title || "");
  const rule = el("div", { position: "absolute", opacity: "0", background: C.accent });
  const sub = el("div", { position: "absolute", width: "100%", opacity: "0",
    top: `${(24 + 54 * TS + 20) * s}px`, fontSize: `${15 * s}px`, letterSpacing: `${0.6 * s}px`,
    color: C.dim, textAlign: L.text.align }, S.subtitle || "");
  const rowsTop = 24 + 54 * TS + 58;
  const rows = (S.rows || []).slice(0, 4).map((r, i) => {
    const wrap = el("div", { position: "absolute", top: `${(rowsTop + i * 54) * s}px`, opacity: "0",
      left: L.text.align === "center" ? "50%" : "0px", textAlign: L.text.align });
    if (L.text.align === "center") wrap.style.marginLeft = `-${90 * s}px`;
    el("div", { fontSize: `${11 * s}px`, letterSpacing: `${2 * s}px`, color: C.dim,
      textAlign: L.text.align }, r.label || "");
    const val = wrap.appendChild(document.createElement("div"));
    Object.assign(val.style, { fontSize: `${18 * s}px`, color: C.text, marginTop: `${5 * s}px`,
      whiteSpace: "nowrap" });
    val.textContent = r.value || "";
    const track = wrap.appendChild(document.createElement("div"));
    Object.assign(track.style, { marginTop: `${8 * s}px`, width: `${180 * s}px`, height: `${4 * s}px`,
      background: rgba(C.border, 0.5), borderRadius: `${3 * s}px`, overflow: "hidden" });
    const fill = track.appendChild(document.createElement("div"));
    Object.assign(fill.style, { height: "100%", width: "0",
      background: r.color || C.series[i % C.series.length] });
    return { wrap, fill, weight: r.weight === undefined ? 1 : r.weight, left: L.text.align === "center" ? "50%" : "0px" };
  });
  const callout = el("div", { position: "absolute", opacity: "0",
    top: `${(rowsTop + Math.min(rows.length, 4) * 54 + 14) * s}px`,
    borderLeft: `${2 * s}px solid ${C.accent2}`, paddingLeft: `${12 * s}px` });
  el("div", { fontSize: `${12 * s}px`, color: C.text }, S.callout ? S.callout.c1 || "" : "");
  el("div", { fontSize: `${11 * s}px`, color: C.dim, marginTop: `${4 * s}px` }, S.callout ? S.callout.c2 || "" : "");

  const footer = el("div", { position: "absolute", opacity: "0", fontSize: `${11 * s}px`,
    letterSpacing: `${s}px`, color: C.dim }, S.footer || "");
  const chip = el("div", { position: "absolute", opacity: "0", fontSize: `${12 * s}px`,
    letterSpacing: `${2 * s}px`, color: C.accent },
    S.chapter ? String(S.chapter.index).padStart(2, "0") + " / " + String(S.chapter.total).padStart(2, "0") : "");

  // ---- placement ----
  const tx = L.text.x * s, ty = L.text.y * s, tw = L.text.w * s;
  block.style.left = `${tx}px`;
  block.style.top = `${ty}px`;
  block.style.width = `${tw}px`;

  const cover = L.subject.mode === "cover";
  if (cover) {
    Object.assign(plate.style, { left: "0px", top: "0px", width: "100%", height: "100%" });
  } else {
    Object.assign(plate.style, {
      left: `${(W() - (L.subject.x + L.subject.w) * s).toFixed(1)}px`,
      top: `${L.subject.y * s}px`,
      width: `${L.subject.w * s}px`,
      height: `${L.subject.h * s}px`
    });
  }

  // rule geometry per style
  let ruleW = 168 * s, ruleH = 3 * s;
  if (RULE_STYLE === "dot") { ruleW = 14 * s; ruleH = 14 * s; rule.style.borderRadius = "50%"; }
  else if (RULE_STYLE === "bracket") {
    ruleW = 34 * s; ruleH = 34 * s;
    Object.assign(rule.style, { background: "transparent", borderLeft: `${4 * s}px solid ${C.accent}`,
      borderTop: `${4 * s}px solid ${C.accent}` });
  } else { rule.style.borderRadius = `${3 * s}px`; }
  rule.style.top = `${(24 + 54 * TS + 6) * s}px`;
  rule.style.left = L.text.align === "center" ? `${(tw - ruleW) / 2}px` : "0px";
  rule.style.width = `${ruleW}px`;
  rule.style.height = `${ruleH}px`;

  // optional middle band for the banner layout
  let band = null;
  if (LAYOUT === "banner") {
    band = el("div", { position: "absolute", left: "0px", width: "100%",
      top: `${208 * s}px`, height: `${196 * s}px`,
      background: rgba(C.surface, 0.5),
      borderTop: `1px solid ${rgba(C.border, 0.55)}`,
      borderBottom: `1px solid ${rgba(C.border, 0.55)}` });
    stage.insertBefore(band, block);
  }

  if (DENSITY === "minimal") {
    rows.forEach(r => { r.wrap.style.display = "none"; });
    callout.style.display = "none";
    footer.style.display = "none";
  }
  footer.style.left = `${tx}px`;
  footer.style.top = `${662 * s}px`;
  chip.style.left = `${tx}px`;
  chip.style.top = `${58 * s}px`;

  return { s, L, bgLayer, halo, vign, plate, scrim, block, eyebrow, title, rule, sub, rows,
           callout, footer, chip, ruleW, cover };
}

let L = build();
window.addEventListener("resize", () => { L = build(); });

let subject = null, subjectReady = false;
if (A.subject) {
  subject = new Image();
  subject.onload = () => { subjectReady = true; window.__sceneReady = true; };
  subject.onerror = () => { subjectReady = true; window.__sceneReady = true; };
  subject.src = A.subject;
} else {
  window.__sceneReady = true;
}

function motionProgress(t, start, dur) {
  return clamp01((t - start / SPEED) / (dur / SPEED));
}

function enter(node, p, fadeOut) {
  const e = (EASE[MO.ease] || EASE.cubic)(clamp01(p));
  const from = MO.from || {};
  const parts = [];
  if (from.y !== undefined) parts.push(`translateY(${(from.y * (1 - e)).toFixed(2)}px)`);
  if (from.x !== undefined) parts.push(`translateX(${(from.x * (1 - e)).toFixed(2)}px)`);
  if (from.scale !== undefined) parts.push(`scale(${(from.scale + (1 - from.scale) * e).toFixed(4)})`);
  if (node.dataset.baseTransform) parts.push(node.dataset.baseTransform);
  node.style.transform = parts.length ? parts.join(" ") : "none";
  const a = (from.opacity === undefined ? 1 : from.opacity + (1 - from.opacity) * e) * fadeOut;
  node.style.opacity = a.toFixed(4);
  if (from.blur !== undefined) node.style.filter = `blur(${(from.blur * (1 - e)).toFixed(2)}px)`;
  if (from.clip !== undefined) node.style.clipPath = `inset(0 ${(from.clip * (1 - e)).toFixed(2)}% 0 0)`;
}

window.seek = (t) => {
  const s = L.s;
  const fadeOut = 1 - easeOut(clamp01((t - (D - 0.55)) / 0.55));

  L.bgLayer.style.opacity = (Math.min(0.85, TEX_AMOUNT * 3.2) * easeOut(clamp01(t / 0.9)) * fadeOut).toFixed(4);
  L.vign.style.opacity = (easeOut(clamp01(t / 1.2)) * fadeOut).toFixed(4);
  L.halo.style.opacity = (0.7 * easeOut(clamp01((t - 1.6) / 1.1)) * fadeOut).toFixed(4);

  enter(L.eyebrow, motionProgress(t, 0.25, 0.5), fadeOut);
  enter(L.title, motionProgress(t, 0.40, 0.7), fadeOut);
  enter(L.sub, motionProgress(t, 0.95, 0.5), fadeOut);
  L.rule.style.opacity = (easeOut(motionProgress(t, 0.80, 0.5)) * fadeOut).toFixed(4);
  L.rule.style.width = `${(L.ruleW * easeOut(motionProgress(t, 0.80, 0.7))).toFixed(2)}px`;

  const mflip = (MO.from && MO.from.clip !== undefined);
  L.rows.forEach((row, i) => {
    const p = motionProgress(t, 1.15 + i * STAGGER, 0.55);
    enter(row.wrap, p, fadeOut);
    if (mflip) row.wrap.style.width = `${(180 * easeOut(p)).toFixed(1)}px`;
    row.fill.style.width = `${(100 * row.weight * easeOut(p)).toFixed(2)}%`;
  });

  const hasCallout = !!(S.callout && (S.callout.c1 || S.callout.c2)) && DENSITY !== "minimal";
  L.callout.style.opacity = ((hasCallout ? 1 : 0) * easeOut(motionProgress(t, 3.2, 0.5)) * fadeOut).toFixed(4);
  L.footer.style.opacity = (0.9 * easeOut(motionProgress(t, 2.1, 0.5)) * fadeOut).toFixed(4);
  L.chip.style.opacity = (0.9 * easeOut(motionProgress(t, 0.3, 0.5)) * fadeOut).toFixed(4);

  const pe = motionProgress(t, 1.5, 0.85);
  const kb = clamp01((t - 2.6) / Math.max(0.5, D - 0.55 - 2.6));
  if (subjectReady && subject) {
    L.plate.style.backgroundImage = `url("${subject.src}")`;
    if (L.cover) {
      L.plate.style.backgroundSize = "cover";
      L.plate.style.filter = LAYOUT === "fullbleed" ? "brightness(0.86) saturate(1.0)" : "brightness(0.80) saturate(0.95)";
      L.plate.style.opacity = ((LAYOUT === "fullbleed" ? 0.78 : 0.6) * easeOut(pe) * fadeOut).toFixed(4);
      L.plate.style.transform = `scale(${(1 + 0.05 * kb).toFixed(4)})`;
      if (L.scrim) L.scrim.style.opacity = (easeOut(pe) * fadeOut).toFixed(4);
    } else {
      L.plate.style.backgroundSize = "contain";
      const sc = (0.94 + 0.06 * easeOut(pe)) * (1 + 0.045 * kb) * SUBJ_SCALE;
      L.plate.style.transform =
        `translateY(${((1 - easeOut(pe)) * 60).toFixed(2)}px) scale(${sc.toFixed(4)})`;
      L.plate.style.opacity = (clamp01(pe * 1.4) * fadeOut).toFixed(4);
    }
  } else if (L.scrim) {
    L.scrim.style.opacity = (easeOut(pe) * fadeOut).toFixed(4);
  }
};

window.seek(0);
</script>
</body>
</html>
