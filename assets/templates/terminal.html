<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #04060c; }
  #stage { position: absolute; inset: 0; }
  #particles { position: absolute; inset: 0; }
  .layer { position: absolute; inset: 0; will-change: transform; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="../runtime/anim.js"></script>
<script src="../runtime/kit.js"></script>
<script>
// terminal: the session is only small type, so the shot gets its mass from the furniture around it -
// a thick status bar, a big counter, rolling log stream, sliding result cards and a CRT refresh band.
// Every one of those keeps moving for the whole shot, which is what stops it reading as a screenshot.
const S = window.SCENE || {};
const V = S.visual || {};
const M = S.motion || {};
const CH = S.choreography || { beats: [{ t: 0, kind: "establish", intensity: 1 }] };
const D = S.duration || 8;
const C = Object.assign({
  bg: "#0a0f1a", surface: "#0d1420", border: "#243049", text: "#dbe6f5", dim: "#5d6b83",
  accent: "#4ade80", accent2: "#38bdf8", accent3: "#fbbf24", series: ["#4ade80"]
}, V.colors || {});
const SHAKE = M.shake || { amp: 1.8, decay: 0.28, freq: 15 };
const DEPTH = M.depth || { bg: 0.3, mid: 0.75, fg: 1.15 };
const PARTICLES = M.particles || { count: 18, speed: 18, size: 1.8, opacity: 0.22, vertical: 6, mode: "streak" };
const TS = V.type_scale || 1;
const RADIUS = V.radius === undefined ? 8 : V.radius;
const TEX = V.texture || "none";
const TEX_AMOUNT = V.texture_amount || 0.1;
const VIGNETTE = V.vignette || 0.3;

const LINES = (S.lines || []).map(l => (typeof l === "string" ? { text: l, kind: "cmd" } : l));
const CPS = Number(S.charsPerSecond || 30);
const PROMPT = S.prompt || "$";
const CARDS = (S.cards || LINES.slice(-3).map(l => ({ label: l.kind || "out", value: l.text }))).slice(0, 3);
const LOG = (S.logLines || []).concat(LINES.map(l => l.text));
const H = () => window.innerHeight, W = () => window.innerWidth;

let L = null;

function build() {
  const s = H() / 720;
  stage.innerHTML = "";
  stage.style.background = "linear-gradient(160deg, #0b1120 0%, #05070d 70%)";
  const kit = Kit.buildStage(stage, {});
  const scene = new Anim.Scene();
  // Perpetual motion for every actor made from here on, so no two frames of the shot match.
  scene.driftDefaults(M.drift || {}, S.id || "terminal");
  const particles = Kit.seedParticles(PARTICLES, S.id || "terminal", W(), H());

  const tex = Kit.el(kit.layerBg, "div", Object.assign({ position: "absolute", inset: "0", opacity: "0" },
                                                       Kit.textureCss(TEX, C.border, TEX_AMOUNT)));
  const halo = Kit.el(kit.layerBg, "div", { position: "absolute", left: `${80 * s}px`, top: `${40 * s}px`,
    width: `${1100 * s}px`, height: `${760 * s}px`, opacity: "0", pointerEvents: "none",
    background: `radial-gradient(closest-side, ${Kit.rgba(C.accent, 0.18)}, ${Kit.rgba(C.accent, 0)} 70%)` });
  const sweep = Kit.el(kit.layerBg, "div", { position: "absolute", top: `${-40 * s}%`, height: `${180 * s}%`,
    width: `${((M.sweep && M.sweep.width) || 240) * s}px`, opacity: "0", pointerEvents: "none",
    background: `linear-gradient(90deg, ${Kit.rgba(C.text, 0)}, ${Kit.rgba(C.text, (M.sweep && M.sweep.opacity) || 0.08)}, ${Kit.rgba(C.text, 0)})`,
    filter: `blur(${24 * s}px)`, transform: `rotate(${(M.sweep && M.sweep.angle) || 0}deg)` });
  const vign = Kit.el(kit.layerBg, "div", { position: "absolute", inset: "0", opacity: "0", pointerEvents: "none",
    background: `radial-gradient(80% 80% at 50% 46%, rgba(0,0,0,0) 40%, rgba(0,0,0,${VIGNETTE}) 100%)` });
  const blobs = Kit.backdrop(kit.layerBg, { color: C.accent2, alpha: 0.24, count: 4, blur: 10,
                                            scale: s, width: 1280, height: 720, duration: D,
                                            seed: (S.id || "terminal") + "-bg" });

  // ---------------- window ----------------
  const winW = W() - 200 * s, winH = H() - 170 * s;
  const win = Kit.el(kit.layerMid, "div", { position: "absolute", left: `${100 * s}px`, top: `${80 * s}px`,
    width: `${winW}px`, height: `${winH}px`, background: Kit.rgba(C.surface, 0.95),
    borderRadius: `${RADIUS * s}px`, border: `${1.5 * s}px solid ${Kit.rgba(C.border, 0.9)}`,
    overflow: "hidden", opacity: "0", boxShadow: `0 ${24 * s}px ${70 * s}px rgba(0,0,0,0.55)` });
  const winA = scene.actor(win, { opacity: 0, scale: 0.94, y: 34 });

  const barH = 46 * s;
  const titleBar = Kit.el(win, "div", { position: "absolute", left: "0px", right: "0px", top: "0px",
    height: `${barH}px`, background: Kit.rgba("#000000", 0.25),
    borderBottom: `${s}px solid ${Kit.rgba(C.border, 0.9)}` });
  ["#ff5f57", "#febc2e", "#28c840"].forEach((col, i) =>
    Kit.el(titleBar, "div", { position: "absolute", left: `${22 + i * 22 * s}px`, top: `${(barH - 13 * s) / 2}px`,
      width: `${13 * s}px`, height: `${13 * s}px`, borderRadius: "50%", background: col }));
  Kit.el(titleBar, "div", { position: "absolute", left: `${100 * s}px`, top: `${13 * s}px`,
    fontSize: `${15 * s}px`, color: Kit.rgba(C.text, 0.75) }, S.windowTitle || "terminal");
  Kit.el(titleBar, "div", { position: "absolute", right: `${22 * s}px`, top: `${13 * s}px`,
    fontSize: `${14 * s}px`, letterSpacing: `${s}px`, color: C.accent }, S.title || "");

  const bodyTop = barH + 26 * s;
  const splitX = winW * 0.58;
  const session = Kit.el(win, "div", { position: "absolute", left: `${28 * s}px`, top: `${bodyTop}px`,
    width: `${splitX - 48 * s}px`, bottom: `${26 * s}px`, fontSize: `${(S.fontSize || 25) * TS * s}px`,
    lineHeight: `${38 * s}px`, color: C.text, fontFamily: "Consolas, 'Cascadia Mono', monospace",
    whiteSpace: "pre-wrap", overflow: "hidden" });

  // ---------------- status panel: the mass ----------------
  const panel = Kit.el(win, "div", { position: "absolute", left: `${splitX}px`, right: `${24 * s}px`,
    top: `${bodyTop}px`, bottom: `${24 * s}px`, background: Kit.rgba("#000000", 0.22),
    border: `${s}px solid ${Kit.rgba(C.border, 0.8)}`, borderRadius: `${6 * s}px`, overflow: "hidden" });
  const logBox = Kit.el(panel, "div", { position: "absolute", left: "0px", right: "0px", top: "0px",
    bottom: `${150 * s}px`, overflow: "hidden", opacity: "0.5" });
  const logInner = Kit.el(logBox, "div", { position: "absolute", left: `${14 * s}px`, right: `${14 * s}px`,
    top: "0px", fontSize: `${16 * s}px`, lineHeight: `${26 * s}px`, color: C.dim,
    fontFamily: "Consolas, 'Cascadia Mono', monospace" });
  const logLines = LOG.length ? LOG : ["..."];
  for (let i = 0; i < 24; i++) {
    const text = logLines[i % logLines.length];
    Kit.el(logInner, "div", { whiteSpace: "nowrap", overflow: "hidden",
      color: i % 3 === 0 ? Kit.rgba(C.accent2, 0.75) : C.dim }, text);
  }
  const logH = 24 * 26 * s;

  const statLabel = Kit.el(panel, "div", { position: "absolute", left: `${16 * s}px`, bottom: `${112 * s}px`,
    fontSize: `${14 * s}px`, letterSpacing: `${2 * s}px`, color: C.dim }, S.statLabel || "PROGRESS");
  const statValue = Kit.el(panel, "div", { position: "absolute", left: `${16 * s}px`, bottom: `${58 * s}px`,
    fontSize: `${56 * s}px`, lineHeight: "1", fontWeight: "500", color: C.text,
    fontVariantNumeric: "tabular-nums" }, "0%");
  const barTrack = Kit.el(panel, "div", { position: "absolute", left: `${16 * s}px`, right: `${16 * s}px`,
    bottom: `${30 * s}px`, height: `${20 * s}px`, background: Kit.rgba("#000000", 0.45),
    borderRadius: `${10 * s}px`, overflow: "hidden" });
  const barFill = Kit.el(barTrack, "div", { height: "100%", width: "0px", background: C.accent,
    borderRadius: `${10 * s}px`, boxShadow: `0 0 ${16 * s}px ${Kit.rgba(C.accent, 0.6)}` });
  const barFillA = scene.actor(barFill, { width: 0 });

  // result cards that slide in over the log when a beat lands
  const cardNodes = CARDS.map((c, i) => {
    const card = Kit.el(panel, "div", { position: "absolute", left: `${14 * s}px`, right: `${14 * s}px`,
      top: `${(i * 62 + 12) * s}px`, height: `${54 * s}px`, background: Kit.rgba(C.bg, 0.92),
      border: `${s}px solid ${Kit.rgba(C.accent, 0.5)}`, borderRadius: `${5 * s}px`, opacity: "0",
      overflow: "hidden" });
    Kit.el(card, "div", { position: "absolute", left: `${10 * s}px`, top: `${8 * s}px`,
      fontSize: `${13 * s}px`, letterSpacing: `${s}px`, color: C.accent }, (c.label || "out").toUpperCase());
    Kit.el(card, "div", { position: "absolute", left: `${10 * s}px`, top: `${26 * s}px`, right: `${10 * s}px`,
      fontSize: `${17 * s}px`, color: C.text, whiteSpace: "nowrap", overflow: "hidden" }, c.value || "");
    return scene.actor(card, { opacity: 0, x: 120 * s });
  });

  const crt = Kit.el(win, "div", { position: "absolute", left: "0px", right: "0px", height: `${110 * s}px`,
    top: "0px", opacity: "0.6", pointerEvents: "none",
    background: `linear-gradient(180deg, ${Kit.rgba(C.accent2, 0)}, ${Kit.rgba(C.accent2, 0.20)}, ${Kit.rgba(C.accent2, 0)})` });

  const footer = Kit.el(kit.layerFg, "div", { position: "absolute", left: `${62 * s}px`, bottom: `${22 * s}px`,
    fontSize: `${13 * s}px`, color: "#5d6b83", opacity: "0" }, S.footer || "");
  const footerA = scene.actor(footer, { opacity: 0, x: -14 });

  const cursor = Kit.el(session, "span", { display: "inline-block", width: `${13 * s}px`, height: `${26 * s}px`,
    background: C.accent, verticalAlign: "-4px", opacity: "1" });
  const cursorA = scene.actor(cursor, { opacity: 1, scale: 1 });

  const cam = Kit.makeCamera(M, [{ node: kit.layerBg, depth: DEPTH.bg }, { node: kit.layerGhost, depth: DEPTH.bg * 0.8 },
                                 { node: kit.layerMid, depth: DEPTH.mid }, { node: kit.layerFg, depth: DEPTH.fg }],
                             { hits: (CH.beats || []).filter(b => b.kind === "emphasis").map(b => b.t),
                               shake: SHAKE, duration: D, boost: 0.9 });

  // ---------------- choreography ----------------
  const at = (k) => (CH.beats || []).find(b => b.kind === k);
  const kinds = (k) => (CH.beats || []).filter(b => b.kind === k);
  const est = at("establish") || { t: 0 };
  const numA = new Anim.Actor(document.createElement("div"), { v: 0 });
  const progressMoves = kinds("build").concat(kinds("emphasis"), kinds("count"));
  const full = () => Math.max(0, winW - splitX - 32 * s);

  winA.to({ opacity: 1, scale: 1, y: 0 }, { at: est.t, dur: 0.9, ease: "out", arc: 20 });
  footerA.to({ opacity: 0.9, x: 0 }, { at: est.t + 0.7, dur: 0.6 });
  cursorA.to({ opacity: 1 }, { at: est.t + 0.3, dur: 0.3 });
  barFillA.to({ width: full() * 0.12 }, { at: est.t + 0.5, dur: 0.8, ease: "out" });
  numA.to({ v: 12 }, { at: est.t + 0.5, dur: 1.0, ease: "out" });
  titleBar.style.opacity = "1";

  progressMoves.forEach((b, i) => {
    const target = Math.min(100, 12 + (i + 1) * (88 / Math.max(1, progressMoves.length)));
    numA.to({ v: target }, { at: b.t, dur: 0.8, spring: 0.6, damping: 0.7 });
    barFillA.to({ width: full() * (target / 100) }, { at: b.t, dur: 0.85, spring: 0.55, damping: 0.65 });
    cursorA.to({ scale: 1.7 }, { at: b.t, dur: 0.22, spring: 0.9, damping: 0.4 });
    cursorA.to({ scale: 1 }, { at: b.t + 0.28, dur: 0.4, ease: "out" });
  });

  // Cards belong to the shot, not to a particular beat: without a build beat they used to never
  // appear at all (the audit caught that as "text nodes never became visible").
  cardNodes.forEach((card, i) => {
    card.to({ opacity: 1, x: 0 }, { at: est.t + 1.4 + i * 0.35, dur: 0.7, spring: 0.5, damping: 0.62, arc: 10 });
    card.to({ opacity: 0.3, x: -8 * s }, { at: est.t + 4.2 + i * 0.35, dur: 0.6, ease: "out" });
  });

  kinds("build").forEach((b, i) => {
    const card = cardNodes[i % Math.max(1, cardNodes.length)];
    if (card) {
      card.to({ opacity: 1, x: 0 }, { at: b.t + 0.15, dur: 0.7, spring: 0.5, damping: 0.62, arc: 10 });
      card.to({ opacity: 0.25, x: -8 * s }, { at: b.t + 2.0, dur: 0.6, ease: "out" });
    }
    winA.to({ scale: 1.008 }, { at: b.t, dur: 0.3, ease: "out" });
    winA.to({ scale: 1 }, { at: b.t + 0.35, dur: 0.6, spring: 0.7, damping: 0.5 });
  });

  kinds("emphasis").forEach((b, i) => {
    winA.to({ scale: 1.016 }, { at: b.t, dur: 0.2, ease: "out" });
    winA.to({ scale: 1 }, { at: b.t + 0.25, dur: 0.6, spring: 0.8, damping: 0.4 });
    barFillA.to({ width: full() * 1.0 }, { at: b.t, dur: 0.6, ease: "back" });
    numA.to({ v: 100 }, { at: b.t, dur: 0.5, ease: "back" });
  });

  const sessionA = scene.actor(session, { y: 0 });
  kinds("transform").forEach((b) => {
    sessionA.to({ y: -38 * s }, { at: b.t, dur: 0.8, ease: "inout", arc: 10 });
    sessionA.to({ y: 0 }, { at: b.t + 1.7, dur: 0.8, ease: "out" });
  });

  kinds("parallax_drift").forEach((b, n) => {
    winA.to({ x: (n % 2 ? -24 : 24), rot: (n % 2 ? 0.7 : -0.7) }, { at: b.t, dur: 1.6, ease: "inout", arc: 22 });
    winA.to({ x: 0, rot: 0 }, { at: b.t + 1.8, dur: 1.0, ease: "out" });
  });

  const ex = at("exit");
  if (ex) {
    winA.to({ scale: 0.99, y: 10 }, { at: ex.t, dur: 0.42, ease: "in" });
    cardNodes.forEach(c => c.to({ x: 30 * s }, { at: ex.t, dur: 0.42, ease: "in" }));
  }

  return { s, kit, scene, tex, halo, sweep, vign, cam, particles, blobs, session, cursorA,
           numA, logInner, logH, crt, winW, winH, barH, splitX, barFillA, statValue };
}

L = build();
window.addEventListener("resize", () => { L = build(); });
window.__sceneReady = true;

function typed(t) {
  const marks = (CH.beats || []).filter(b => b.kind === "build" || b.kind === "emphasis").map(b => b.t);
  let budget = Math.max(0, t - 0.5) * CPS;
  const out = [];
  for (let i = 0; i < LINES.length; i++) {
    const line = LINES[i];
    const text = line.text || "";
    if (budget <= 0) break;
    const gate = marks[i];
    if (gate !== undefined && t < gate && i > 0) break;
    const take = Math.min(text.length, Math.floor(budget));
    out.push({ line, shown: text.slice(0, take), done: take >= text.length });
    budget -= take + Number(line.pause === undefined ? 6 : line.pause);
  }
  return out;
}

window.seek = (t) => {
  const fadeOut = 1 - Anim.EASE.out(Math.min(1, Math.max(0, (t - (D - 0.4)) / 0.4)));
  const bump = L.cam.apply(t);
  L.scene.seek(t, null);          // render every actor: without this the scene stays at opacity 0
  L.blobs.forEach(b => b.render(t));
  L.kit.layerFg.style.opacity = fadeOut.toFixed(4);
  L.kit.layerMid.style.opacity = fadeOut.toFixed(4);
  L.kit.flash.style.background = `radial-gradient(120% 120% at 50% 50%, ${Kit.rgba(C.accent, 0.42)}, ${Kit.rgba(C.accent, 0)} 60%)`;
  L.kit.flash.style.mixBlendMode = "screen";
  L.kit.flash.style.opacity = (Math.min(0.4, bump * 0.3) * fadeOut).toFixed(4);
  Kit.ambient(L, t, { fade: fadeOut, textureAmount: TEX_AMOUNT,
                      pulseAmount: (M.pulse && M.pulse.amount) || 0.012,
                      pulseFreq: (M.pulse && M.pulse.freq) || 1,
                      sweepSpeed: (M.sweep && M.sweep.speed) || 320,
                      sweepOpacity: (M.sweep && M.sweep.opacity) || 0.08,
                      cuts: M.cuts || [] });
  Kit.drawParticles(L.kit.ctx, L.particles, t, C.text, W(), H());

  // rolling log: the panel keeps streaming for the whole shot
  const span = L.logH;
  L.logInner.style.transform = `translateY(${(-((t * 46 * L.s) % span)).toFixed(1)}px)`;

  // CRT refresh band sweeping the window
  const sweepSpan = L.winH + 140 * L.s;
  L.crt.style.top = `${(((t * 340 * L.s) % sweepSpan) - 70 * L.s).toFixed(1)}px`;

  // counter keeps ticking between beats
  const v = L.numA.sample(t).v || 0;
  const jitter = 1 + 0.004 * Math.sin(t * 6.7);
  L.statValue.textContent = Math.min(100, v * jitter).toFixed(0) + "%";

  const rows = typed(t);
  const html = rows.map(({ line, shown, done }) => {
    const color = line.kind === "out" ? C.dim : line.kind === "ok" ? C.accent :
      line.kind === "warn" ? C.accent3 : C.text;
    const head = line.kind === "cmd" ? `<span style="color:${C.accent2}">${PROMPT} </span>` : "";
    void done;
    return `<div style="color:${color}">${head}${shown}</div>`;
  }).join("");
  L.session.innerHTML = html;
  L.session.appendChild(L.cursorA.node);
  L.cursorA.node.style.opacity = (Math.floor(t * 3) % 2 ? 0.18 : 1) * fadeOut;
};

window.seek(0);
</script>
</body>
</html>
